# Publishes docs/ to GitHub Pages as static files, with no generator in the
# path. Closes the second half of #122.
#
# WHY THIS EXISTS, because the obvious reading is that it changes nothing.
# The site is hand-authored static HTML and always was — CLAUDE.md said so
# for months. But Pages, configured to deploy from a branch, runs **Jekyll**
# over the directory on every push whether the project wants it or not, and
# that is not a theoretical cost:
#
#   2026-08-04 14:54  a commit adds a GitHub Actions example containing `{{`
#                     to a markdown file under docs/design/
#   2026-08-04 14:54  the Pages build fails, two seconds later
#   ...               seven consecutive failures, across every merge
#   2026-08-05 12:09  first success, after the cause was removed
#
# For twenty-two hours the published site served the previous release, and
# nothing said so: a failed publish looks exactly like a site that has not
# changed. The mechanism is worth stating because Jekyll's own documentation
# says it cannot happen — a markdown file without front matter is a static
# file. GitHub Pages is not vanilla Jekyll: it loads
# jekyll-optional-front-matter by default (0.3.2 against Jekyll 3.10.0, per
# https://pages.github.com/versions.json), which turns a front-matter-less
# markdown file into a page and runs Liquid over it. `{{` opens a Liquid
# variable, and `format('{{Hello {0}!}}', secrets.TOKEN)` — an example of
# how Actions escapes braces by doubling them — is an unterminated one.
#
# docs/_config.yml excluded design/ to stop it. This removes the class
# instead: no Jekyll, no Liquid, no front matter, nothing between the files
# in the repository and the files served.
#
# This workflow IS the alarm, which is the other half of what #122 argued.
# The check in ci.yml polled /pages/builds/latest to notice a failed build,
# and that endpoint reports LEGACY builds — the ones this change stops
# producing. A deploy that fails here is a red run on the commit that caused
# it, which is the signal the polling existed to synthesise.
name: pages

on:
  push:
    branches: [main]
    # Not path-filtered on docs/** alone: the landing carries a version
    # pill and the guide is generated by nobody, so a release-prep commit
    # that touches docs/ is covered — but a change to THIS file has to be
    # able to deploy itself, or fixing the deployment would need an
    # unrelated docs edit to ride along.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # So a deployment can be re-run without an empty commit, which the
  # branch-source setup never needed because every push rebuilt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and NOT cancel-in-progress: a cancelled
# deploy-pages can leave the deployment half-created, and the site is worth
# more than the thirty seconds saved. A superseded run simply publishes an
# older tree a moment before the newer one replaces it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A guard rather than a formality. The artifact is whatever is in
      # docs/, and an empty or missing directory would deploy an empty site
      # over a working one — a destructive success, which is the shape of
      # failure this whole issue is about.
      - name: There is a site to publish
        run: |
          set -euo pipefail
          test -f docs/index.html || { echo "::error::docs/index.html is missing — refusing to publish an empty site"; exit 1; }
          n=$(find docs -type f | wc -l | tr -d ' ')
          [ "$n" -ge 10 ] || { echo "::error::only $n files under docs/ — refusing to publish what looks like an empty tree"; exit 1; }
          echo "publishing $n files"

      - name: Upload docs/ verbatim
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
