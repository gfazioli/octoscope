# Release workflow. Triggered by pushing a `v*` tag; runs goreleaser
# to produce multi-arch archives, a GitHub Release, checksums, and a
# Homebrew formula PR'd into gfazioli/homebrew-tap.
#
# Required repository secret:
#   HOMEBREW_TAP_TOKEN — a PAT with contents:write on
#                        gfazioli/homebrew-tap (fine-grained is fine).
#                        The default GITHUB_TOKEN can't cross-repo
#                        push, which is why we need a dedicated one.
#
# To cut a release:
#   1. git tag -a v0.3.0 -m "Release v0.3.0"
#   2. git push origin v0.3.0
#   3. Watch the Actions tab; goreleaser handles the rest.

name: release

on:
  push:
    tags:
      - "v*"

# Cancel a prior release run for the same tag if someone force-
# retags. Avoids two goreleaser runs fighting over the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # contents:write lets goreleaser create the GitHub Release and
  # upload archives to it. No other scopes needed on this repo —
  # the Homebrew push uses HOMEBREW_TAP_TOKEN instead.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history to compute the changelog
          # from commit messages since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Mirror the release into gfazioli/gh-octoscope, which exists for one
      # reason: `gh` derives an extension's name from the repository name
      # and refuses anything not prefixed `gh-`, so `gh extension install
      # gfazioli/octoscope` cannot work. Same tag, same binaries out of the
      # same dist/ — nothing is rebuilt and nothing can drift.
      #
      # Stable tags only. gh resolves an extension through
      # /repos/:owner/:repo/releases/latest, which excludes prereleases, so
      # an -rc mirrored there would be invisible as well as pointless.
      #
      # Uses GH_EXTENSION_TOKEN rather than GITHUB_TOKEN because the default
      # token cannot write to another repository — the same reason the
      # Homebrew push carries its own. It is scoped to contents:write on
      # gh-octoscope and nothing else.
      - name: Mirror the release to gh-octoscope
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GH_EXTENSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/stage-gh-assets.py dist/artifacts.json mirror

          cat > mirror-notes.md <<NOTES
          octoscope \`$TAG\` as a \`gh\` extension.

          \`\`\`bash
          gh extension install gfazioli/gh-octoscope
          gh octoscope
          \`\`\`

          The binaries here are the ones from
          [gfazioli/octoscope@$TAG](https://github.com/gfazioli/octoscope/releases/tag/$TAG),
          uploaded unchanged. Release notes, changelog and issues live there.
          NOTES

          gh release create "$TAG" mirror/* \
            --repo gfazioli/gh-octoscope \
            --title "$TAG" \
            --notes-file mirror-notes.md

          # Verify the effect, not the command: a `gh release create` that
          # uploaded nothing still exits 0.
          count=$(gh release view "$TAG" --repo gfazioli/gh-octoscope \
                    --json assets --jq '.assets | length')
          echo "assets on gh-octoscope@$TAG: $count"
          [ "$count" -eq 5 ] || { echo "expected 5 assets, found $count"; exit 1; }
