# Release workflow. Triggered by pushing a `v*` tag.
#
# Two jobs, and they are separate on purpose:
#   release — goreleaser: multi-arch archives, bare binaries, a GitHub
#             Release, checksums, and a Homebrew formula PR'd into
#             gfazioli/homebrew-tap.
#   mirror  — copies the bare binaries into a twin release on
#             gfazioli/gh-octoscope, so `gh extension install` works.
#
# The split is what makes the second half recoverable. Re-running on the
# same tag is a hard error for goreleaser, and Actions re-runs *jobs*,
# not steps — so a mirror that failed inside the release job could never
# be retried: the re-run would die at goreleaser and never reach it. As
# its own job it re-runs alone, and it reads the published release
# rather than goreleaser's dist/, so a retry needs nothing left over
# from the first attempt.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN  — PAT, contents:write on gfazioli/homebrew-tap.
#   GH_EXTENSION_TOKEN  — PAT, contents:write on gfazioli/gh-octoscope.
# Both exist for the same reason: the default GITHUB_TOKEN cannot write
# to another repository.
#
# To cut a release:
#   1. git tag -a v0.3.0 -m "Release v0.3.0"
#   2. git push origin v0.3.0
#   3. Watch the Actions tab; goreleaser handles the rest.

name: release

on:
  push:
    tags:
      - "v*"

# Cancel a prior release run for the same tag if someone force-
# retags. Avoids two goreleaser runs fighting over the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Nothing at the workflow level beyond read: a token minted for one job
# is a token every future job inherits, and the two that need more say so
# themselves below.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents:write lets goreleaser create the GitHub Release and
      # upload the archives. The Homebrew push crosses into another repo
      # and travels on HOMEBREW_TAP_TOKEN instead.
      contents: write
      # packages:write lets it push the images to ghcr.io.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history to compute the changelog
          # from commit messages since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # dockers_v2 issues ONE `docker buildx build --platform
      # linux/amd64,linux/arm64 --push`, and the default `docker` driver
      # can only export a multi-platform image when the daemon runs the
      # containerd image store. GitHub's Ubuntu runners do not, so the
      # export would fail here even though it succeeds on a developer
      # machine that happens to have containerd enabled — which is
      # exactly how this nearly shipped. A docker-container builder
      # supports it regardless of the host's image store.
      - name: Set up a multi-platform builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # goreleaser's dockers_v2 pushes to ghcr.io, which needs the daemon
      # authenticated first. GITHUB_TOKEN is enough — ghcr.io accepts it
      # for packages under the same owner — so no extra secret, unlike the
      # Homebrew and gh-octoscope pushes which cross into other repos.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A GHCR package does NOT inherit its repository's visibility —
      # GitHub's own docs say permissions are inherited "but not the
      # visibility" — so the package this release creates is private
      # until somebody flips it once, by hand, in the package settings.
      # There is no REST endpoint for it.
      #
      # Until that happens the README advertises a `docker pull` that
      # every user is denied, and nothing else in this workflow would
      # notice: goreleaser pushed successfully, using credentials.
      # So: ask for an anonymous pull token the way an unauthenticated
      # client does, and say so loudly if it comes back without access.
      #
      # A warning rather than a failure, deliberately. Everything above
      # has already published by this point, and re-running the job would
      # die at goreleaser on the release that now exists — turning a
      # one-time settings change into a stuck release.
      - name: Can a stranger pull the image?
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          repo=gfazioli/octoscope
          tag="${GITHUB_REF_NAME#v}"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
                    | jq -r '.token // empty')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${token}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json" \
                   "https://ghcr.io/v2/${repo}/manifests/${tag}")
          echo "anonymous manifest fetch: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning title=Container image is not public::ghcr.io/${repo}:${tag} answered HTTP ${code} to an anonymous pull. A new GHCR package is private until changed by hand — set it to Public once at https://github.com/users/gfazioli/packages/container/octoscope/settings . The README documents an unauthenticated docker pull until then."
          fi

  # gfazioli/gh-octoscope exists for one reason: `gh` derives an
  # extension's name from the repository name and refuses anything not
  # prefixed `gh-`, so `gh extension install gfazioli/octoscope` fails
  # before it downloads anything. This job keeps that repo in step.
  #
  # It reads the release the previous job published rather than its
  # dist/ directory. That is deliberate twice over: it makes the job
  # re-runnable on its own with nothing carried over, and it mirrors the
  # bytes users actually get rather than the bytes we happened to build.
  #
  # Stable tags only. gh decides whether a repo is a binary extension by
  # calling /releases/latest — isBinExtension does this *before* and
  # regardless of any --pin — and that endpoint excludes prereleases and
  # drafts. So a gh-octoscope holding only a prerelease is not
  # installable at all, pinned or otherwise. Measured, not inferred.
  mirror:
    needs: release
    # `needs` for ordering, but deliberately NOT gated on release having
    # succeeded. goreleaser publishes the GitHub release *before* it
    # pushes the Homebrew formula — its own pipeline says so in a
    # comment, "brew et al use the release URL, so, they should be last"
    # — so an expired HOMEBREW_TAP_TOKEN leaves a perfectly good release
    # published and the job red. Under a plain needs-gate the mirror
    # would be skipped, and no re-run could ever reach it, because
    # goreleaser rejects the release that already exists. So: run unless
    # the workflow was cancelled, and let the first step decide whether
    # there is anything to mirror.
    if: ${{ !cancelled() && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      # Reads octoscope's own release; the cross-repo write travels on
      # GH_EXTENSION_TOKEN instead.
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      SOURCE: gfazioli/octoscope
      TWIN: gfazioli/gh-octoscope
    steps:
      - name: Is there a release to mirror?
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Asked through `gh api` rather than `gh release view` so the
          # HTTP status is legible. Both exit 1 on every failure alike,
          # and "there is no such release" and "I could not ask" must not
          # collapse into the same answer: a rate limit or a 5xx read as
          # "nothing to mirror" would leave this job green having
          # published nothing, which is the exact shape of bug the 0.30.0
          # cycle spent itself removing — "not checked" wearing the same
          # face as "fine".
          if err=$(gh api "repos/$SOURCE/releases/tags/$TAG" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$err" | grep -q '(HTTP 404)'; then
            # A real absence: goreleaser died before publishing. The
            # release job is already red saying so, so this one records
            # the fact and stops rather than failing a second time for
            # the same reason.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SOURCE@$TAG was never published — nothing to mirror"
          else
            # 401, 403, a rate limit, a 5xx, DNS — none of these are an
            # answer about the release.
            echo "could not determine whether $SOURCE@$TAG exists: $err" >&2
            exit 1
          fi

      - name: Download the bare binaries from the published release
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The platforms .goreleaser.yaml builds, spelled the way gh
          # looks for them: it picks an asset with
          # strings.HasSuffix(name, platform+ext). Each is fetched by
          # exact name, so a target dropped from the build fails here
          # instead of quietly shipping an extension that is
          # "unsupported" on somebody's machine.
          for suffix in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64.exe; do
            gh release download "$TAG" --repo "$SOURCE" \
              --pattern "octoscope_${version}_${suffix}" --dir mirror
          done
          ls -l mirror

      - name: Create or repair the twin release on gh-octoscope
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_EXTENSION_TOKEN }}
        run: |
          set -euo pipefail
          cat > mirror-notes.md <<NOTES
          octoscope \`$TAG\` as a \`gh\` extension.

          \`\`\`bash
          gh extension install gfazioli/gh-octoscope
          gh octoscope
          \`\`\`

          The binaries here are the ones from
          [gfazioli/octoscope@$TAG](https://github.com/gfazioli/octoscope/releases/tag/$TAG),
          uploaded unchanged. Release notes, changelog and issues live there.
          NOTES

          # Converge rather than create, so the job is re-runnable in
          # every state and not only the happy one. `gh release create`
          # on an existing tag exits 1 with "a release with the same tag
          # name already exists" — measured — so a first attempt that
          # died anywhere after creation would leave the retry
          # permanently stuck on the state it was meant to repair.
          if gh release view "$TAG" --repo "$TWIN" >/dev/null 2>&1; then
            echo "release exists — repairing it rather than recreating"
            gh release upload "$TAG" mirror/* --repo "$TWIN" --clobber
            # --draft/--prerelease=false because this branch is already
            # clobbering the assets and the notes: leaving the
            # publication flags alone would respect an intent the rest
            # of the command overrides anyway, and either one makes the
            # extension unresolvable.
            gh release edit "$TAG" --repo "$TWIN" \
              --draft=false --prerelease=false \
              --notes-file mirror-notes.md

            # --clobber replaces assets whose names collide; it does not
            # remove ones that should not be there. A stray matters for
            # more than the count below: gh selects with HasSuffix and
            # takes the FIRST match it iterates onto, so an extra asset
            # ending in a platform suffix can shadow ours.
            expected=$(cd mirror && printf '%s\n' *)
            gh release view "$TAG" --repo "$TWIN" --json assets \
              --jq '.assets[].name' |
            while read -r name; do
              if ! printf '%s\n' "$expected" | grep -qxF -- "$name"; then
                echo "removing stale asset: $name"
                gh release delete-asset "$TAG" "$name" --repo "$TWIN" --yes
              fi
            done
          else
            gh release create "$TAG" mirror/* \
              --repo "$TWIN" \
              --title "$TAG" \
              --notes-file mirror-notes.md
          fi

          # Verify the effect, not the command: `gh release create` that
          # uploaded nothing also exits 0.
          #
          # Draft and prerelease are asserted alongside the count because
          # they are the difference between a release that exists and one
          # gh can install — see isBinExtension, above.
          read -r count draft pre < <(
            gh release view "$TAG" --repo "$TWIN" \
              --json assets,isDraft,isPrerelease \
              --jq '"\(.assets | length) \(.isDraft) \(.isPrerelease)"')
          echo "$TWIN@$TAG: assets=$count draft=$draft prerelease=$pre"
          [ "$count" -eq 5 ] || { echo "expected 5 assets, found $count"; exit 1; }
          [ "$draft" = "false" ] || { echo "release is a draft; gh cannot resolve it"; exit 1; }
          [ "$pre" = "false" ] || { echo "release is a prerelease; gh cannot resolve it"; exit 1; }
