# Release workflow. Triggered by pushing a `v*` tag.
#
# Two jobs, and they are separate on purpose:
#   release — goreleaser: multi-arch archives, bare binaries, a GitHub
#             Release, checksums, and a Homebrew formula PR'd into
#             gfazioli/homebrew-tap.
#   mirror  — copies the bare binaries into a twin release on
#             gfazioli/gh-octoscope, so `gh extension install` works.
#
# The split is what makes the second half recoverable. Re-running on the
# same tag is a hard error for goreleaser, and Actions re-runs *jobs*,
# not steps — so a mirror that failed inside the release job could never
# be retried: the re-run would die at goreleaser and never reach it. As
# its own job it re-runs alone, and it reads the published release
# rather than goreleaser's dist/, so a retry needs nothing left over
# from the first attempt.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN  — PAT, contents:write on gfazioli/homebrew-tap.
#   GH_EXTENSION_TOKEN  — PAT, contents:write on gfazioli/gh-octoscope.
# Both exist for the same reason: the default GITHUB_TOKEN cannot write
# to another repository.
#
# To cut a release:
#   1. git tag -a v0.3.0 -m "Release v0.3.0"
#   2. git push origin v0.3.0
#   3. Watch the Actions tab; goreleaser handles the rest.

name: release

on:
  push:
    tags:
      - "v*"

# Cancel a prior release run for the same tag if someone force-
# retags. Avoids two goreleaser runs fighting over the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Nothing at the workflow level beyond read: a token minted for one job
# is a token every future job inherits, and the two that need more say so
# themselves below.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents:write lets goreleaser create the GitHub Release and
      # upload the archives. The Homebrew push crosses into another repo
      # and travels on HOMEBREW_TAP_TOKEN instead.
      contents: write
      # packages:write lets it push the images to ghcr.io.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history to compute the changelog
          # from commit messages since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # dockers_v2 issues ONE `docker buildx build --platform
      # linux/amd64,linux/arm64 --push`, and the default `docker` driver
      # can only export a multi-platform image when the daemon runs the
      # containerd image store. GitHub's Ubuntu runners do not, so the
      # export would fail here even though it succeeds on a developer
      # machine that happens to have containerd enabled — which is
      # exactly how this nearly shipped. A docker-container builder
      # supports it regardless of the host's image store.
      - name: Set up a multi-platform builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # goreleaser's dockers_v2 pushes to ghcr.io, which needs the daemon
      # authenticated first. GITHUB_TOKEN is enough — ghcr.io accepts it
      # for packages under the same owner — so no extra secret, unlike the
      # Homebrew and gh-octoscope pushes which cross into other repos.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to the version the CI snapshot renders and checks, so the
          # published cask is the one that was verified rather than whatever
          # v2 happens to be at tag time. Keep the two workflows in step.
          version: "v2.18.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # macOS signing + notarization. All five are consumed by the
          # `notarize` block in .goreleaser.yaml, whose `enabled` template
          # keys off MACOS_SIGN_P12: with the secrets absent the pipe skips
          # itself silently and the binaries ship ad-hoc signed. That is not
          # a soft landing — verify-macos then fails on the missing team
          # identifier, which is the intended outcome, because a release
          # that quietly stopped being signed is the thing worth a red X.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # A GHCR package does NOT inherit its repository's visibility —
      # The Homebrew formula carried `test: system "#{bin}/octoscope
      # --version"`, and a cask has no `test` stanza (goreleaser's own
      # cask has none either), so #142 would have dropped it silently.
      #
      # How much was actually lost is smaller than it looks, and worth
      # stating rather than dramatising: a formula's test runs on `brew
      # test`, and on Homebrew's CI for core formulae — NOT on install.
      # In a third-party tap nothing ran it automatically, so the stanza
      # was a check nobody was executing.
      #
      # This step is therefore a net gain rather than a like-for-like
      # replacement, and its coverage is narrow on purpose: it downloads
      # the LINUX x86_64 tarball from the release just published and runs
      # it. It does not exercise either macOS artifact, and it does not
      # exercise a Homebrew install at all — that is #165's job, by hand,
      # once. What it does cover is the one thing no other check did: the
      # bytes a user downloads actually start.
      #
      # A hard failure, unlike the ghcr check below. That one warns
      # because a private package is a settings problem with the artifact
      # intact; here the artifact itself would be broken, and a red
      # release is the correct signal for a binary that does not start.
      # Nothing is un-published either way.
      - name: Does the published binary start?
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="octoscope_${version}_Linux_x86_64.tar.gz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/smoke
          tar -xzf "/tmp/smoke/$asset" -C /tmp/smoke
          out="$(/tmp/smoke/octoscope --version)"
          echo "published binary says: $out"
          # Asserting the version rather than just a zero exit: a binary
          # built from the wrong ref would start perfectly well and be the
          # thing worth catching. This is the same check version_test.go
          # makes at build time, aimed at the artifact people download.
          case "$out" in
            *"$version"*) ;;
            *) echo "::error title=Published binary reports the wrong version::expected $version in: $out"; exit 1 ;;
          esac

      # GitHub's own docs say permissions are inherited "but not the
      # visibility" — so the package this release creates is private
      # until somebody flips it once, by hand, in the package settings.
      # There is no REST endpoint for it.
      #
      # Until that happens the README advertises a `docker pull` that
      # every user is denied, and nothing else in this workflow would
      # notice: goreleaser pushed successfully, using credentials.
      # So: ask for an anonymous pull token the way an unauthenticated
      # client does, and say so loudly if it comes back without access.
      #
      # A warning rather than a failure, deliberately. Everything above
      # has already published by this point, and re-running the job would
      # die at goreleaser on the release that now exists — turning a
      # one-time settings change into a stuck release.
      - name: Can a stranger pull the image?
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          repo=gfazioli/octoscope
          tag="${GITHUB_REF_NAME#v}"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
                    | jq -r '.token // empty')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${token}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json" \
                   "https://ghcr.io/v2/${repo}/manifests/${tag}")
          echo "anonymous manifest fetch: HTTP $code"
          if [ "$code" != "200" ]; then
            # Pointing at the package list rather than at a settings URL
            # composed by hand: that path cannot be visited before the
            # package exists, and a link nobody can check is a link that
            # rots quietly. The list page is stable, works today, and the
            # settings button is one click from it.
            echo "::warning title=Container image is not public::ghcr.io/${repo}:${tag} answered HTTP ${code} to an anonymous pull, so the README's docker pull is denied for everyone. A new GHCR package is private until changed by hand, once, and there is no API for it: open https://github.com/gfazioli?tab=packages -> octoscope -> Package settings -> Change visibility -> Public."
          fi

  # Nothing in the release job can tell you whether the macOS binaries
  # were really notarized. goreleaser's notary pipe fails on an Invalid
  # or a Rejected verdict, but on a TIMEOUT it logs "notarize timeout"
  # and carries on (internal/pipe/notary/macos.go, read at v2.18.1), so
  # a slow notary ships a signed-but-unnotarized binary behind a green
  # build. That is 0.34.1's failure shape exactly: green here, SIGKILL
  # on the user's Mac.
  #
  # So this job reads no logs. It downloads what was published, puts the
  # quarantine flag back by hand, and runs it. Measured 2026-09-13:
  # unnotarized + quarantined is exit 137 with no output, notarized +
  # quarantined prints the version and exits 0. There is no third
  # answer, which is what makes it a gate rather than a report.
  #
  # It then installs the published cask and runs the linked binary,
  # closing #179 — until now nothing automated had ever executed
  # octoscope on a Mac.
  #
  # macos-latest on purpose, not a pinned image: a new macOS tightening
  # Gatekeeper is precisely the thing we want to hear about from CI
  # rather than from a user.
  verify-macos:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download the archives that were actually published
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "no jq on the runner image"; exit 1; }
          gh release download "$TAG" -R "${{ github.repository }}" \
             --pattern '*macOS_arm64.tar.gz' \
             --pattern '*macOS_x86_64.tar.gz' --dir .
          ls -l ./*.tar.gz
          # A download that produced nothing passes every check below, so
          # it is not allowed to look like a pass.
          test -s ./*macOS_arm64.tar.gz
          test -s ./*macOS_x86_64.tar.gz
          for arch in arm64 x86_64; do
            mkdir -p "extract-$arch"
            tar -xzf ./*macOS_"$arch".tar.gz -C "extract-$arch"
            test -x "extract-$arch/octoscope"
          done

      - name: Both binaries carry our Developer ID and the hardened runtime
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            echo "--- $arch ---"
            out=$(codesign -dv --verbose=2 "extract-$arch/octoscope" 2>&1)
            printf '%s\n' "$out"
            printf '%s' "$out" | grep -q 'TeamIdentifier=QWWPDQNH5L' ||
              { echo "::error::$arch: not signed with our Developer ID"; exit 1; }
            # Apple refuses to notarize without it, so its absence means the
            # notarization we believe happened did not.
            printf '%s' "$out" | grep -q 'flags=0x10000(runtime)' ||
              { echo "::error::$arch: hardened runtime is not enabled"; exit 1; }
          done

      # Deliberately BEFORE any spctl call. spctl performs an assessment,
      # and an assessment may warm syspolicyd's verdict cache — in which
      # case a later execution would be inheriting that verdict instead of
      # proving a cold first launch, which is the only launch a user gets.
      # Whether the cache actually behaves that way on the hosted image is
      # not something this job can establish, so it simply never depends on
      # the answer.
      - name: A cold quarantined launch works, with no cask hook involved
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for arch in arm64 x86_64; do
            bin="extract-$arch/octoscope"
            xattr -w com.apple.quarantine "0083;00000000;GitHubActions;" "$bin"
            set +e
            out=$("./$bin" --version 2>&1); rc=$?
            set -e
            case "$out" in
              *"bad CPU type"*)
                # Rosetta is not promised by the runner image. Say so rather
                # than letting a skipped test read as a passed one.
                echo "::warning title=Intel binary was not executed::no Rosetta on this runner, so the x86_64 build has static checks only"
                continue
                ;;
            esac
            if [ "$rc" -ne 0 ]; then
              echo "::error::$arch: quarantined binary exited $rc (137 is Gatekeeper's SIGKILL). Output: ${out:-<none>}"
              exit 1
            fi
            # Ties the artifact to the tag: a stale asset would run perfectly
            # well and tell us nothing.
            [ "$out" = "octoscope $version" ] ||
              { echo "::error::$arch: expected 'octoscope $version', got '$out'"; exit 1; }
            echo "$arch: $out"
          done

      - name: An unnotarized copy is still refused, i.e. this runner enforces
        run: |
          set -euo pipefail
          # Without this the step above is a check that cannot fail: if
          # Gatekeeper is not enforcing on the runner image, a broken binary
          # runs too and the job passes having measured nothing.
          #
          # The control is the state 0.34.2 actually ships — a valid ad-hoc
          # signature, which arm64 requires to execute at all, and no
          # notarization. Both halves are asserted on the SAME file, so the
          # only difference between them is the quarantine flag and
          # Gatekeeper is the only thing that can explain the change.
          cp extract-arm64/octoscope control
          xattr -c control
          codesign --force --sign - control
          out=$(./control --version 2>&1) ||
            { echo "::error::the control does not run even unquarantined, so it cannot test anything: $out"; exit 1; }
          echo "control runs unquarantined: $out"

          xattr -w com.apple.quarantine "0083;00000000;GitHubActions;" control
          set +e
          out=$(./control --version 2>&1); rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::an ad-hoc signed, quarantined binary RAN (said '$out'). Gatekeeper is not enforcing here, so every notarization check above is vacuous."
            exit 1
          fi
          # Specifically SIGKILL. Any other non-zero exit means the control
          # died of something that is not Gatekeeper, and then it is not a
          # control.
          [ "$rc" -eq 137 ] ||
            { echo "::error::control exited $rc, expected 137 (SIGKILL). It failed for the wrong reason: ${out:-<none>}"; exit 1; }
          echo "control refused under quarantine: exit 137, as measured"

      - name: Gatekeeper calls them notarized, not merely signed
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            # spctl exits non-zero on a rejection and the verdict we need is
            # in its output either way.
            out=$(spctl -a -vvv -t install "extract-$arch/octoscope" 2>&1) || true
            printf '%s\n' "$out"
            printf '%s' "$out" | grep -q 'source=Notarized Developer ID' ||
              { echo "::error::$arch: $(printf '%s' "$out" | tr '\n' ' ')"; exit 1; }
          done

      - name: The published cask installs the bytes we just verified
        # Stable tags only. `skip_upload: auto` in .goreleaser.yaml means
        # goreleaser does not push the tap for a prerelease at all
        # (internal/pipe/cask/cask.go: SkipUpload == "auto" &&
        # ctx.Semver.Prerelease != ""), so on an -rc this step would wait for
        # a cask nobody published and turn every prerelease red for a
        # non-reason. The signing checks above stay on, because a prerelease
        # is exactly where a signing problem should surface.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Read the tap from git rather than the JSON API: the API is
          # regenerated on its own schedule, so right after a release it
          # still describes the PREVIOUS version and this would pass against
          # software we shipped days ago.
          export HOMEBREW_NO_INSTALL_FROM_API=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap gfazioli/tap
          avail=""
          # Four probes around three fetches, so the LAST fetch is followed by
          # a probe. Fetching and then giving up without looking again is a
          # false failure waiting for the one run where the tap lands during
          # that fetch.
          for attempt in 1 2 3 4; do
            avail=$(brew info --cask --json=v2 gfazioli/tap/octoscope 2>/dev/null |
                      jq -r '.casks[0].version // empty')
            [ "$avail" = "$version" ] && break
            [ "$attempt" -eq 4 ] && break
            echo "tap offers '${avail:-nothing}', waiting for $version (probe $attempt)"
            sleep 15
            git -C "$(brew --repo gfazioli/tap)" fetch -q origin
            git -C "$(brew --repo gfazioli/tap)" reset -q --hard origin/HEAD
          done
          [ "$avail" = "$version" ] ||
            { echo "::error::tap never offered $version (last saw '${avail:-nothing}')"; exit 1; }

          brew install --cask gfazioli/tap/octoscope
          # `brew install` answers "already installed" and exits 0 without
          # staging anything, so its exit code is not evidence. The installed
          # version is.
          installed=$(brew list --cask --versions octoscope | awk '{print $2}')
          [ "$installed" = "$version" ] ||
            { echo "::error::cask installed '$installed', expected '$version'"; exit 1; }
          linked="$(brew --prefix)/bin/octoscope"
          got=$("$linked" --version)
          echo "got: $got"
          [ "$got" = "octoscope $version" ] ||
            { echo "::error::linked binary said '$got'"; exit 1; }
          # And it is the same artifact, not merely one reporting the same
          # number. The cask's xattr step removes an extended attribute,
          # which does not touch file content, so these must match byte for
          # byte.
          want=$(shasum -a 256 extract-arm64/octoscope | cut -d' ' -f1)
          have=$(shasum -a 256 "$linked" | cut -d' ' -f1)
          [ "$want" = "$have" ] ||
            { echo "::error::the cask installed different bytes: $have vs the verified $want"; exit 1; }
          echo "cask binary matches the verified archive: $want"

  # gfazioli/gh-octoscope exists for one reason: `gh` derives an
  # extension's name from the repository name and refuses anything not
  # prefixed `gh-`, so `gh extension install gfazioli/octoscope` fails
  # before it downloads anything. This job keeps that repo in step.
  #
  # It reads the release the previous job published rather than its
  # dist/ directory. That is deliberate twice over: it makes the job
  # re-runnable on its own with nothing carried over, and it mirrors the
  # bytes users actually get rather than the bytes we happened to build.
  #
  # Stable tags only. gh decides whether a repo is a binary extension by
  # calling /releases/latest — isBinExtension does this *before* and
  # regardless of any --pin — and that endpoint excludes prereleases and
  # drafts. So a gh-octoscope holding only a prerelease is not
  # installable at all, pinned or otherwise. Measured, not inferred.
  mirror:
    needs: release
    # `needs` for ordering, but deliberately NOT gated on release having
    # succeeded. goreleaser publishes the GitHub release *before* it
    # pushes the Homebrew formula — its own pipeline says so in a
    # comment, "brew et al use the release URL, so, they should be last"
    # — so an expired HOMEBREW_TAP_TOKEN leaves a perfectly good release
    # published and the job red. Under a plain needs-gate the mirror
    # would be skipped, and no re-run could ever reach it, because
    # goreleaser rejects the release that already exists. So: run unless
    # the workflow was cancelled, and let the first step decide whether
    # there is anything to mirror.
    if: ${{ !cancelled() && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      # Reads octoscope's own release; the cross-repo write travels on
      # GH_EXTENSION_TOKEN instead.
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      SOURCE: gfazioli/octoscope
      TWIN: gfazioli/gh-octoscope
    steps:
      - name: Is there a release to mirror?
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Asked through `gh api` rather than `gh release view` so the
          # HTTP status is legible. Both exit 1 on every failure alike,
          # and "there is no such release" and "I could not ask" must not
          # collapse into the same answer: a rate limit or a 5xx read as
          # "nothing to mirror" would leave this job green having
          # published nothing, which is the exact shape of bug the 0.30.0
          # cycle spent itself removing — "not checked" wearing the same
          # face as "fine".
          if err=$(gh api "repos/$SOURCE/releases/tags/$TAG" --silent 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$err" | grep -q '(HTTP 404)'; then
            # A real absence: goreleaser died before publishing. The
            # release job is already red saying so, so this one records
            # the fact and stops rather than failing a second time for
            # the same reason.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SOURCE@$TAG was never published — nothing to mirror"
          else
            # 401, 403, a rate limit, a 5xx, DNS — none of these are an
            # answer about the release.
            echo "could not determine whether $SOURCE@$TAG exists: $err" >&2
            exit 1
          fi

      - name: Download the bare binaries from the published release
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The platforms .goreleaser.yaml builds, spelled the way gh
          # looks for them: it picks an asset with
          # strings.HasSuffix(name, platform+ext). Each is fetched by
          # exact name, so a target dropped from the build fails here
          # instead of quietly shipping an extension that is
          # "unsupported" on somebody's machine.
          for suffix in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64.exe; do
            gh release download "$TAG" --repo "$SOURCE" \
              --pattern "octoscope_${version}_${suffix}" --dir mirror
          done
          ls -l mirror

      - name: Create or repair the twin release on gh-octoscope
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_EXTENSION_TOKEN }}
        run: |
          set -euo pipefail
          cat > mirror-notes.md <<NOTES
          octoscope \`$TAG\` as a \`gh\` extension.

          \`\`\`bash
          gh extension install gfazioli/gh-octoscope
          gh octoscope
          \`\`\`

          The binaries here are the ones from
          [gfazioli/octoscope@$TAG](https://github.com/gfazioli/octoscope/releases/tag/$TAG),
          uploaded unchanged. Release notes, changelog and issues live there.
          NOTES

          # Converge rather than create, so the job is re-runnable in
          # every state and not only the happy one. `gh release create`
          # on an existing tag exits 1 with "a release with the same tag
          # name already exists" — measured — so a first attempt that
          # died anywhere after creation would leave the retry
          # permanently stuck on the state it was meant to repair.
          if gh release view "$TAG" --repo "$TWIN" >/dev/null 2>&1; then
            echo "release exists — repairing it rather than recreating"
            gh release upload "$TAG" mirror/* --repo "$TWIN" --clobber
            # --draft/--prerelease=false because this branch is already
            # clobbering the assets and the notes: leaving the
            # publication flags alone would respect an intent the rest
            # of the command overrides anyway, and either one makes the
            # extension unresolvable.
            gh release edit "$TAG" --repo "$TWIN" \
              --draft=false --prerelease=false \
              --notes-file mirror-notes.md

            # --clobber replaces assets whose names collide; it does not
            # remove ones that should not be there. A stray matters for
            # more than the count below: gh selects with HasSuffix and
            # takes the FIRST match it iterates onto, so an extra asset
            # ending in a platform suffix can shadow ours.
            expected=$(cd mirror && printf '%s\n' *)
            gh release view "$TAG" --repo "$TWIN" --json assets \
              --jq '.assets[].name' |
            while read -r name; do
              if ! printf '%s\n' "$expected" | grep -qxF -- "$name"; then
                echo "removing stale asset: $name"
                gh release delete-asset "$TAG" "$name" --repo "$TWIN" --yes
              fi
            done
          else
            gh release create "$TAG" mirror/* \
              --repo "$TWIN" \
              --title "$TAG" \
              --notes-file mirror-notes.md
          fi

          # Verify the effect, not the command: `gh release create` that
          # uploaded nothing also exits 0.
          #
          # Draft and prerelease are asserted alongside the count because
          # they are the difference between a release that exists and one
          # gh can install — see isBinExtension, above.
          read -r count draft pre < <(
            gh release view "$TAG" --repo "$TWIN" \
              --json assets,isDraft,isPrerelease \
              --jq '"\(.assets | length) \(.isDraft) \(.isPrerelease)"')
          echo "$TWIN@$TAG: assets=$count draft=$draft prerelease=$pre"
          [ "$count" -eq 5 ] || { echo "expected 5 assets, found $count"; exit 1; }
          [ "$draft" = "false" ] || { echo "release is a draft; gh cannot resolve it"; exit 1; }
          [ "$pre" = "false" ] || { echo "release is a prerelease; gh cannot resolve it"; exit 1; }
