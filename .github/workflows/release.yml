# Release workflow. Triggered by pushing a `v*` tag.
#
# Five jobs, and they are separate on purpose:
#
#   release      — goreleaser: multi-arch archives, bare binaries,
#                  checksums, container images, and a GitHub Release
#                  created as a DRAFT.
#   verify-macos — downloads the release's assets — the draft's on a tag
#                  push, an already published release's on a dispatch —
#                  and proves the macOS binaries are signed, hardened and
#                  notarized.
#   promote      — publishes the release, then pushes the Homebrew cask
#                  goreleaser rendered but did not upload.
#   verify-cask  — installs the published cask and checks it delivers the
#                  bytes verify-macos verified.
#   mirror       — copies the bare binaries into a twin release on
#                  gfazioli/gh-octoscope, so `gh extension install` works.
#
# The first three are the gate #182 asked for: nothing a macOS user can
# download or install exists at a public URL until the verification has
# passed. It does not cover the container images, which goreleaser pushes
# inside `release` — see #191.
#
# The split is also what makes the later halves recoverable. Re-running on
# the same tag is a hard error for goreleaser, and Actions re-runs *jobs*,
# not steps — so anything that failed inside the release job could never
# be retried: the re-run would die at goreleaser and never reach it. As
# their own jobs they re-run alone.
#
# That is unqualified for verify-macos, verify-cask and mirror, which read
# the release itself and need nothing left over from the first attempt. It
# is NOT unqualified for promote: it also needs the cask artifact, which
# lives for 90 days and not forever, so its recovery window is that long
# rather than indefinite. After it, the cask would have to be written by
# hand — goreleaser will not render another for a tag whose release
# exists.
#
# The one state that escapes all of this is a draft left behind by a red
# release job — see #192.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN  — PAT, contents:write on gfazioli/homebrew-tap.
#   GH_EXTENSION_TOKEN  — PAT, contents:write on gfazioli/gh-octoscope.
# Both exist for the same reason: the default GITHUB_TOKEN cannot write
# to another repository.
#
#   MACOS_SIGN_P12         — Developer ID Application cert + private key,
#                            exported as .p12 and base64'd.
#   MACOS_SIGN_PASSWORD    — the password that .p12 was exported with.
#   MACOS_NOTARY_ISSUER_ID — App Store Connect issuer UUID. Team keys only:
#                            an Individual key has no issuer and goreleaser
#                            requires one.
#   MACOS_NOTARY_KEY_ID    — the key's id, also inside the .p8 filename.
#   MACOS_NOTARY_KEY       — the App Store Connect .p8 private key, base64'd.
# These five sign and notarize the macOS binaries. With them missing the
# notarize pipe skips itself quietly and the binaries ship ad-hoc signed,
# so verify-macos is what turns that into a red X rather than a surprise
# on a user's Mac.
#
# To cut a release:
#   1. git tag -a v0.3.0 -m "Release v0.3.0"
#   2. git push origin v0.3.0
#   3. Watch the Actions tab; goreleaser handles the rest.

name: release

on:
  push:
    tags:
      - "v*"
  # Re-run the macOS verification against a tag that is already published,
  # without building or publishing anything. It exists so the gate can be
  # exercised without cutting a release — v0.34.3 shipped a verify job that
  # had never run, and its first run failed on a property of the runner
  # rather than on the release. A check nobody can rehearse is a check
  # nobody has tested.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published tag to re-verify, e.g. v0.34.3"
        required: true
        type: string

# Cancel a prior release run for the same tag if someone force-
# retags. Avoids two goreleaser runs fighting over the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Nothing at the workflow level beyond read: a token minted for one job
# is a token every future job inherits, and the two that need more say so
# themselves below.
permissions:
  contents: read

jobs:
  release:
    outputs:
      # The digest of the cask carried to promote, so the handoff can be
      # checked rather than trusted.
      cask-sha256: ${{ steps.cask.outputs.sha256 }}
    # A manual dispatch verifies; it never builds or publishes.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      # contents:write lets goreleaser create the GitHub Release and
      # upload the archives. The Homebrew push crosses into another repo
      # and travels on HOMEBREW_TAP_TOKEN instead.
      contents: write
      # packages:write lets it push the images to ghcr.io.
      packages: write
    steps:
      # Before anything is built, let alone published. The notarize block's
      # `enabled` template keys off MACOS_SIGN_P12 so that a laptop running
      # `goreleaser release --snapshot` needs no secrets — but that same
      # template means a secret deleted or renamed here silently disables
      # signing, and goreleaser would publish a non-draft release of ad-hoc
      # binaries before verify-macos ever gets to fail. A red job afterwards
      # does not un-publish anything.
      #
      # This does not cover a notary TIMEOUT, which is decided long after
      # this step and is what #182 is about. It covers the half that can be
      # known up front, which is the half that costs eight lines.
      - name: Signing secrets exist, before anything is published
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD \
                      MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID \
                      MACOS_NOTARY_KEY; do
            # Captured, never echoed: the test is emptiness, not the value.
            value=$(printenv "$name" || true)
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Refusing to publish an unsigned macOS release::missing secrets:$missing"
            exit 1
          fi
          echo "all five signing secrets are present"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs full history to compute the changelog
          # from commit messages since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # dockers_v2 issues ONE `docker buildx build --platform
      # linux/amd64,linux/arm64 --push`, and the default `docker` driver
      # can only export a multi-platform image when the daemon runs the
      # containerd image store. GitHub's Ubuntu runners do not, so the
      # export would fail here even though it succeeds on a developer
      # machine that happens to have containerd enabled — which is
      # exactly how this nearly shipped. A docker-container builder
      # supports it regardless of the host's image store.
      - name: Set up a multi-platform builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # goreleaser's dockers_v2 pushes to ghcr.io, which needs the daemon
      # authenticated first. GITHUB_TOKEN is enough — ghcr.io accepts it
      # for packages under the same owner — so no extra secret, unlike the
      # Homebrew and gh-octoscope pushes which cross into other repos.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned to the version the CI snapshot renders and checks, so the
          # published cask is the one that was verified rather than whatever
          # v2 happens to be at tag time. Keep the two workflows in step.
          version: "v2.18.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No HOMEBREW_TAP_TOKEN here any more. With skip_upload: true
          # goreleaser never pushes the tap, and it never resolves the
          # token either: doPublish returns at its skip check (cask.go:155
          # in v2.18.1, the version pinned above) 35 lines before
          # client.NewIfToken, and the ApplyAll list in doRun does not
          # include Repository.Token. Confirmed from the other side too —
          # a snapshot run with the variable removed from the environment
          # renders the cask and exits 0. The tap-writing job holds it now.
          # macOS signing + notarization. All five are consumed by the
          # `notarize` block in .goreleaser.yaml, whose `enabled` template
          # keys off MACOS_SIGN_P12: with the secrets absent the pipe skips
          # itself silently and the binaries ship ad-hoc signed. That is not
          # a soft landing — verify-macos then fails on the missing team
          # identifier, which is the intended outcome, because a release
          # that quietly stopped being signed is the thing worth a red X.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # A GHCR package does NOT inherit its repository's visibility —
      # The Homebrew formula carried `test: system "#{bin}/octoscope
      # --version"`, and a cask has no `test` stanza (goreleaser's own
      # cask has none either), so #142 would have dropped it silently.
      #
      # How much was actually lost is smaller than it looks, and worth
      # stating rather than dramatising: a formula's test runs on `brew
      # test`, and on Homebrew's CI for core formulae — NOT on install.
      # In a third-party tap nothing ran it automatically, so the stanza
      # was a check nobody was executing.
      #
      # This step is therefore a net gain rather than a like-for-like
      # replacement, and its coverage is narrow on purpose: it downloads
      # the LINUX x86_64 tarball from the release just published and runs
      # it. It does not exercise either macOS artifact, and it does not
      # exercise a Homebrew install at all — that is #165's job, by hand,
      # once. What it does cover is the one thing no other check did: the
      # bytes a user downloads actually start.
      #
      # A hard failure, unlike the ghcr check below. That one warns
      # because a private package is a settings problem with the artifact
      # intact; here the artifact itself would be broken, and a red
      # release is the correct signal for a binary that does not start.
      # Nothing is un-published either way.
      - name: Does the published binary start?
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="octoscope_${version}_Linux_x86_64.tar.gz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/smoke
          tar -xzf "/tmp/smoke/$asset" -C /tmp/smoke
          out="$(/tmp/smoke/octoscope --version)"
          echo "published binary says: $out"
          # Asserting the version rather than just a zero exit: a binary
          # built from the wrong ref would start perfectly well and be the
          # thing worth catching. This is the same check version_test.go
          # makes at build time, aimed at the artifact people download.
          case "$out" in
            *"$version"*) ;;
            *) echo "::error title=Published binary reports the wrong version::expected $version in: $out"; exit 1 ;;
          esac

      # GitHub's own docs say permissions are inherited "but not the
      # visibility" — so the package this release creates is private
      # until somebody flips it once, by hand, in the package settings.
      # There is no REST endpoint for it.
      #
      # Until that happens the README advertises a `docker pull` that
      # every user is denied, and nothing else in this workflow would
      # notice: goreleaser pushed successfully, using credentials.
      # So: ask for an anonymous pull token the way an unauthenticated
      # client does, and say so loudly if it comes back without access.
      #
      # A warning rather than a failure, deliberately. Everything above
      # has already published by this point, and re-running the job would
      # die at goreleaser on the release that now exists — turning a
      # one-time settings change into a stuck release.
      - name: Can a stranger pull the image?
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          repo=gfazioli/octoscope
          tag="${GITHUB_REF_NAME#v}"
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" \
                    | jq -r '.token // empty')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${token}" \
                   -H "Accept: application/vnd.oci.image.index.v1+json" \
                   "https://ghcr.io/v2/${repo}/manifests/${tag}")
          echo "anonymous manifest fetch: HTTP $code"
          if [ "$code" != "200" ]; then
            # Pointing at the package list rather than at a settings URL
            # composed by hand: that path cannot be visited before the
            # package exists, and a link nobody can check is a link that
            # rots quietly. The list page is stable, works today, and the
            # settings button is one click from it.
            echo "::warning title=Container image is not public::ghcr.io/${repo}:${tag} answered HTTP ${code} to an anonymous pull, so the README's docker pull is denied for everyone. A new GHCR package is private until changed by hand, once, and there is no API for it: open https://github.com/gfazioli?tab=packages -> octoscope -> Package settings -> Change visibility -> Public."
          fi

      # The cask goreleaser rendered but did not push (#182). The promote
      # job commits this exact file to the tap once the release is public,
      # so nothing downstream re-implements goreleaser's template — the
      # bytes that reach the tap are the bytes it generated.
      #
      # if-no-files-found: error, because an empty artifact would make
      # promote skip the tap silently and the release would ship without a
      # cask. A missing input must not look like "nothing to do".
      # Recorded before the upload, so promote can prove the bytes it
      # commits are the bytes goreleaser wrote. Without it "the bytes that
      # reach the tap are the bytes it generated" is a claim about a file
      # that made a round trip through artifact storage unchecked.
      - name: Record the rendered cask's digest
        id: cask
        run: |
          set -euo pipefail
          f=dist/homebrew/Casks/octoscope.rb
          test -f "$f"
          echo "sha256=$(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          sha256sum "$f"

      - name: Carry the rendered cask to the promote job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-cask
          # The exact file, not dist/homebrew/Casks/*.rb: a glob would
          # carry whatever else ever lands in that directory, and the
          # consumer would have to pick. `if-no-files-found: error` then
          # means what it says — this one file, or the job fails.
          path: dist/homebrew/Casks/octoscope.rb
          if-no-files-found: error
          # 90 days, not the 1 this started as. This artifact is the only
          # copy of the rendered cask: goreleaser will not produce another,
          # because re-running it against a tag whose release exists is a
          # hard error. Its lifetime is therefore the window in which a
          # failed promote can still be finished by re-running that job
          # alone. A day is shorter than a weekend, and a tap token that
          # expired on a Friday would outlive it — leaving a public release
          # with no cask and no way back but writing one by hand.
          retention-days: 90

  # Nothing in the release job can tell you whether the macOS binaries
  # were really notarized. goreleaser's notary pipe fails on an Invalid
  # or a Rejected verdict, but on a TIMEOUT it logs "notarize timeout"
  # and carries on (internal/pipe/notary/macos.go, read at v2.18.1), so
  # a slow notary ships a signed-but-unnotarized binary behind a green
  # build. That is 0.34.1's failure shape exactly: green here, SIGKILL
  # on the user's Mac.
  #
  # So this job reads no logs. It downloads what was published, puts the
  # quarantine flag back by hand, and runs it. Measured 2026-09-13:
  # unnotarized + quarantined is exit 137 with no output, notarized +
  # quarantined prints the version and exits 0. There is no third
  # answer, which is what makes it a gate rather than a report.
  #
  # It then installs the published cask and runs the linked binary,
  # closing #179 — until now nothing automated had ever executed
  # octoscope on a Mac.
  #
  # macos-latest on purpose, not a pinned image: a new macOS tightening
  # Gatekeeper is precisely the thing we want to hear about from CI
  # rather than from a user.
  verify-macos:
    needs: release
    # A status-check function is required at all, because on a dispatch the
    # release job is skipped and a skipped dependency would otherwise skip
    # this one too. `!cancelled()` rather than `always()`: the latter also
    # evaluates true after someone cancels the run, which would start a macOS
    # runner they had just asked to stop. Same form the mirror job uses.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: macos-latest
    permissions:
      # write, not the read this job's work would suggest, because the
      # release it verifies is now a DRAFT and GitHub has no permission
      # meaning "may read drafts": a draft is visible only to a caller
      # with push access, which for a GITHUB_TOKEN is contents: write.
      #
      # Measured before relying on it, because the whole of #182 turns on
      # it. At contents: read, against a real draft, `gh release download`
      # answers "release not found" and exits 1 — this job would fail
      # before checking anything and the release would stay a draft
      # forever. The same call at contents: write returns the asset. So do
      # `gh release view` (read: "release not found"; write:
      # {"isDraft":true}) and the list endpoint, which answers 200 at
      # contents: read and simply OMITS the draft.
      #
      # The job never writes: it downloads, runs codesign / spctl /
      # stapler and exits. Write is the price of reading a draft at all.
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # GH_TOKEN is NOT here. It belongs to the one step that talks to the
      # API, and to no other, because of what the rest of this job does:
      # it RUNS the binaries it just downloaded. A job-scoped token is in
      # the environment of every process those steps start, so a release
      # binary that was not what we think it is would inherit a token that
      # — since this job needs contents: write to read a draft at all —
      # can publish the very release it is being checked for. The verifier
      # would hand the gate's key to the thing on trial.
    steps:
      - name: Download the archives that were actually published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "no jq on the runner image"; exit 1; }
          gh release download "$TAG" -R "${{ github.repository }}" \
             --pattern '*macOS_arm64.tar.gz' \
             --pattern '*macOS_x86_64.tar.gz' --dir .
          ls -l ./*.tar.gz
          # A download that produced nothing passes every check below, so
          # it is not allowed to look like a pass.
          test -s ./*macOS_arm64.tar.gz
          test -s ./*macOS_x86_64.tar.gz
          for arch in arm64 x86_64; do
            mkdir -p "extract-$arch"
            tar -xzf ./*macOS_"$arch".tar.gz -C "extract-$arch"
            test -x "extract-$arch/octoscope"
          done

      - name: Both binaries carry our Developer ID and the hardened runtime
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            echo "--- $arch ---"
            out=$(codesign -dv --verbose=2 "extract-$arch/octoscope" 2>&1)
            printf '%s\n' "$out"
            printf '%s' "$out" | grep -q 'TeamIdentifier=QWWPDQNH5L' ||
              { echo "::error::$arch: not signed with our Developer ID"; exit 1; }
            # Apple refuses to notarize without it, so its absence means the
            # notarization we believe happened did not.
            printf '%s' "$out" | grep -q 'flags=0x10000(runtime)' ||
              { echo "::error::$arch: hardened runtime is not enabled"; exit 1; }
          done

      # What a runner can prove about Gatekeeper is not a constant, so this
      # step measures it instead of assuming it — and v0.34.3 is why. That
      # release was correctly signed, correctly notarized, and ran under
      # quarantine on a real Mac; the job still went red, because on the
      # hosted image an ad-hoc-signed quarantined binary runs happily. The
      # control was right to speak up and wrong to be fatal: it had found
      # that it could not measure, not that anything was broken.
      #
      # Two independent controls, because they answer different questions:
      #
      #   spctl discriminates?  — does `spctl` refuse the ad-hoc copy while
      #     accepting the published one? If yes, the notarization verdict in
      #     the next step means something even where launches are not
      #     policed, and it is a hard gate. If spctl calls an ad-hoc binary
      #     notarized, the tool is lying and that IS fatal: it would pass
      #     every future release unconditionally.
      #
      #   launches are policed?  — is the ad-hoc copy actually killed when
      #     quarantined? Only then does "the real binary ran" carry any
      #     information, so that assertion is promoted to a gate only here.
      #
      # Both run on a copy of the shipped binary re-signed ad-hoc — the exact
      # state 0.34.2 shipped — so the only variable is the signature.
      - name: What can this runner actually prove?
        run: |
          set -euo pipefail
          echo "spctl --status: $(spctl --status 2>&1 || true)"
          cp extract-arm64/octoscope control
          xattr -c control
          codesign --force --sign - control

          # A control that cannot run is not a control.
          out=$(./control --version 2>&1) ||
            { echo "::error::the ad-hoc control does not run even unquarantined: $out"; exit 1; }
          echo "control runs unquarantined: $out"

          # Control 1 — does spctl tell the two apart?
          ctl=$(spctl -a -vvv -t install control 2>&1) || true
          printf 'spctl on the ad-hoc control: %s\n' "$(printf '%s' "$ctl" | tr '\n' ' ')"
          if printf '%s' "$ctl" | grep -q 'source=Notarized Developer ID'; then
            echo "::error::spctl called an ad-hoc-signed binary notarized. The notarization check below cannot fail, so it is not a check."
            exit 1
          fi
          echo "spctl discriminates: the notarization verdict below is a real gate"

          # Control 2 — are quarantined launches policed here?
          xattr -w com.apple.quarantine "0083;00000000;GitHubActions;" control
          xattr -l control | grep -q com.apple.quarantine ||
            { echo "::error::the quarantine attribute did not stick, so nothing about quarantine can be tested on this filesystem"; exit 1; }
          set +e
          out=$(./control --version 2>&1); rc=$?
          set -e
          case "$rc" in
            137)
              echo "GATEKEEPER_POLICES_LAUNCH=yes" >> "$GITHUB_ENV"
              echo "quarantined ad-hoc binary was killed: launches are policed here"
              ;;
            0)
              echo "GATEKEEPER_POLICES_LAUNCH=no" >> "$GITHUB_ENV"
              echo "::warning title=This runner does not police quarantined launches::an ad-hoc-signed quarantined binary ran (said '$out'), so the launch test below proves nothing here and is reported, not gated. The notarization verdict above is unaffected and still gates."
              ;;
            *)
              echo "::error::the control exited $rc, which is neither a clean run nor SIGKILL. It died of something that is not Gatekeeper: ${out:-<none>}"
              exit 1
              ;;
          esac

      - name: Gatekeeper calls them notarized, not merely signed
        run: |
          set -euo pipefail
          for arch in arm64 x86_64; do
            # spctl exits non-zero on a rejection and the verdict we need is
            # in its output either way.
            out=$(spctl -a -vvv -t install "extract-$arch/octoscope" 2>&1) || true
            printf '%s\n' "$out"
            printf '%s' "$out" | grep -q 'source=Notarized Developer ID' ||
              { echo "::error::$arch: $(printf '%s' "$out" | tr '\n' ' ')"; exit 1; }
          done

      - name: The quarantined binaries run
        run: |
          set -euo pipefail
          version="${TAG#v}"
          policed="${GATEKEEPER_POLICES_LAUNCH:-no}"
          # Ask whether Rosetta is there, rather than recognising its
          # complaint. Deciding to skip assertions by matching program output
          # means any invocation that happens to print that phrase skips them,
          # and the phrase is Apple's to reword. The runner image does not
          # promise Rosetta, so the answer is genuinely unknown each run.
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            rosetta=yes
          else
            rosetta=no
          fi
          echo "rosetta available: $rosetta"
          for goarch in arm64 x86_64; do
            if [ "$goarch" = "x86_64" ] && [ "$rosetta" != "yes" ]; then
              # Say it was skipped. A skipped test must not read as a passed one.
              echo "::warning title=Intel binary was not executed::no Rosetta on this runner, so the x86_64 build has static checks only"
              continue
            fi
            bin="extract-$goarch/octoscope"
            xattr -w com.apple.quarantine "0083;00000000;GitHubActions;" "$bin"
            set +e
            out=$("./$bin" --version 2>&1); rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              # Fatal either way: policed or not, the shipped binary must run.
              echo "::error::$goarch: quarantined binary exited $rc (137 is Gatekeeper's SIGKILL). Output: ${out:-<none>}"
              exit 1
            fi
            # Always a gate, and independent of Gatekeeper: it ties the
            # artifact to the tag, so a stale asset cannot pass.
            [ "$out" = "octoscope $version" ] ||
              { echo "::error::$goarch: expected 'octoscope $version', got '$out'"; exit 1; }
            if [ "$policed" = "yes" ]; then
              echo "$goarch: $out — and this runner kills an unnotarized equivalent, so that is evidence"
            else
              echo "$goarch: $out — informational only: this runner does not police quarantined launches"
            fi
          done

  # Everything above this point happened on a DRAFT release: the assets
  # exist but are not at the public download path, and no cask points at
  # them. This is the job that makes it real, and it runs only after
  # verify-macos has said the macOS binaries are genuinely notarized.
  #
  # That ordering is the whole of #182. Before it, goreleaser published a
  # non-draft release and verify-macos ran afterwards — so between the
  # publish and the red X the assets were downloadable and the cask was
  # live. goreleaser's notary pipe logs "notarize timeout" and carries on
  # (internal/pipe/notary/macos.go at v2.18.1), and the `default` branch of
  # that same switch logs "notarize still pending" and carries on too, so
  # there are two ways to ship a signed-but-unnotarized binary behind a
  # green build. A red job afterwards un-publishes nothing.
  #
  # Both steps are idempotent on purpose, because this job is the new thing
  # that can fail halfway and the workflow's re-runnability is deliberate:
  # `gh release edit --draft=false` on an already-published release is a
  # no-op, and the tap push checks whether the file is already there.
  promote:
    needs: [release, verify-macos]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && needs.verify-macos.result == 'success' }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Fetched and checked BEFORE the release is published, deliberately.
      # Publishing is the irreversible half of this job — a release cannot
      # be un-published without someone noticing — so everything knowable
      # beforehand is established first. In the other order a missing or
      # stale artifact turned a verified draft into a public release and
      # only THEN failed, leaving exactly the state this job exists to
      # prevent: something installable, with no cask.
      #
      # Stable tags only, which is what `skip_upload: auto` used to do
      # inside goreleaser: a prerelease uploads archives for testing but
      # must not bump the cask people install.
      - name: Fetch the cask goreleaser rendered
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: homebrew-cask
          path: cask

      - name: The artifact is goreleaser's cask, for this tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          WANT_SHA: ${{ needs.release.outputs.cask-sha256 }}
        run: |
          set -euo pipefail
          file=cask/octoscope.rb
          # Named, and required to be exactly one regular file. `find ... |
          # head -1` would silently pick one of several and call it the
          # cask; a count that must equal 1 cannot.
          n=$(find cask -type f -name '*.rb' | wc -l | tr -d ' ')
          [ "$n" = "1" ] && [ -f "$file" ] || {
            echo "::error::expected exactly one cask in the artifact, found $n:"
            find cask -type f | sed 's/^/  /'; exit 1; }

          # Same bytes goreleaser wrote, not merely a file with the right
          # name and a plausible version line.
          got_sha=$(sha256sum "$file" | cut -d' ' -f1)
          [ -n "$WANT_SHA" ] || { echo "::error::the release job recorded no cask digest"; exit 1; }
          [ "$got_sha" = "$WANT_SHA" ] || {
            echo "::error::cask digest $got_sha does not match the $WANT_SHA goreleaser wrote"; exit 1; }

          # And it is this tag's cask. A stale artifact would otherwise
          # publish the previous release's cask under this tag's name,
          # which is the failure that looks most like success.
          #
          # Compared as a string, not matched as a pattern: interpolating
          # the version into a regex makes every `.` a wildcard, so a check
          # for 1.2.3 is also satisfied by a cask reading `version "1x2y3"`.
          # awk parses the stanza and the comparison is `=`.
          want="${TAG#v}"
          got=$(awk '$1=="version"{gsub(/^"|"$/,"",$2); print $2; exit}' "$file")
          [ "$got" = "$want" ] || {
            echo "::error::the rendered cask is for '${got:-nothing}', not $want"; exit 1; }
          echo "cask $got, digest $got_sha — matches what goreleaser wrote"

      - name: Publish the release
        run: |
          set -euo pipefail
          # Read it first: `gh release edit` on a release that is already
          # public succeeds and says nothing, so the log would look the
          # same whether this job did its work or found it done. On a
          # re-run after a partial failure, which half ran matters.
          was=$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft)
          echo "release was draft: $was"
          if [ "$was" = "true" ]; then
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false
            echo "published $TAG"
          else
            echo "already published, nothing to do"
          fi
          # And assert the end state rather than the command's exit code.
          now=$(gh release view "$TAG" -R "${{ github.repository }}" --json isDraft -q .isDraft)
          [ "$now" = "false" ] || { echo "::error::$TAG is still a draft after publishing"; exit 1; }

      - name: Push it to the tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # Already established, before the release was published: exactly
          # one cask in the artifact, its digest goreleaser's, its version
          # this tag's.
          file=cask/octoscope.rb
          want="${TAG#v}"

          # Cloned WITHOUT the token: gfazioli/homebrew-tap is public, so
          # reading it needs no credential, and a token in the clone URL is
          # written verbatim into tap/.git/config, where any later
          # `git remote -v` or error path can print it. It is supplied to
          # the push alone.
          #
          # --branch main, explicitly: the cask is configured to live on
          # main (.goreleaser.yaml, homebrew_casks[].repository.branch:
          # main) and a clone that silently followed a changed default
          # would commit somewhere nobody taps.
          git clone --depth 1 --branch main https://github.com/gfazioli/homebrew-tap.git tap

          # Refuse to go backwards. The version check above proves the cask
          # matches THIS tag; it says nothing about whether this tag is
          # still the newest. Re-running an old release's promote job — and
          # the artifact lives 90 days, so that is a real window — would
          # otherwise copy the old cask over a newer one, the staged diff
          # would read as an ordinary update, and every `brew upgrade`
          # would roll users back.
          #
          # sort -V, not a string compare: 0.9.0 sorts after 0.10.0
          # lexicographically and before it by version. Both orders were
          # checked, along with the equal case and an empty tap.
          have=$(awk '$1=="version"{gsub(/^"|"$/,"",$2); print $2; exit}' \
                   tap/Casks/octoscope.rb 2>/dev/null || true)
          if [ -n "$have" ] && [ "$have" != "$want" ]; then
            newest=$(printf '%s\n%s\n' "$have" "$want" | sort -V | tail -1)
            [ "$newest" = "$want" ] || {
              echo "::error::the tap offers $have, which is newer than $want — refusing to roll Homebrew users back. This is what re-running an older tag's promote job looks like."
              exit 1; }
          fi

          mkdir -p tap/Casks
          cp "$file" tap/Casks/octoscope.rb
          ( cd tap
            # Staged first, then `git diff --cached`. The obvious order —
            # `git diff --quiet` before `git add` — reports "nothing to do"
            # for a file git is not tracking yet, so a tap that had lost
            # its cask, or a first push of a renamed one, would be recorded
            # as already up to date and silently skipped. Demonstrated in a
            # throwaway repository rather than reasoned about. Today's tap
            # does carry Casks/octoscope.rb, so this is a latent hole, not
            # a live one — which is exactly the kind that surfaces years
            # later as "the release ran green and shipped no cask".
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Casks/octoscope.rb
            if git diff --cached --quiet; then
              echo "the tap already carries this cask, nothing to push"
              exit 0
            fi
            git commit -m "octoscope $want"
            git push "https://x-access-token:${TAP_TOKEN}@github.com/gfazioli/homebrew-tap.git" HEAD:main
            echo "pushed octoscope $want to the tap" )

  # The half of the old verify-macos that could only run once the release
  # and the cask were public. It is its own job now because promote sits
  # between: the cask does not exist until then.
  verify-cask:
    needs: [verify-macos, promote]
    runs-on: macos-latest
    # Runs on a dispatch too, and that is not incidental. The dispatch
    # trigger exists so this verification can be REHEARSED against an
    # already published tag — v0.34.3 shipped a verify job that had never
    # run, and its first run failed on a property of the runner. Splitting
    # the cask check into its own job behind a push-only `promote` would
    # have made it, once again, a check nobody can rehearse.
    #
    # `!cancelled()` because on a dispatch `promote` is skipped, and a
    # skipped dependency would otherwise skip this. Same form verify-macos
    # uses, for the same reason.
    #
    # verify-macos must have PASSED either way. Without that clause a
    # dispatch ran this job even when the signing and notarization checks
    # had just failed — and the step below is named "the published cask
    # installs the bytes we just verified", which would then be a claim
    # about bytes nothing verified.
    if: ${{ !cancelled() && needs.verify-macos.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.promote.result == 'success') && !contains(inputs.tag || github.ref_name, '-') }}
    permissions:
      contents: read
    env:
      # The tag, not the ref: on a dispatch `github.ref_name` is the branch
      # the run was launched from, so the prerelease gate above and this
      # value would both be reading a branch name.
      TAG: ${{ inputs.tag || github.ref_name }}
      # Scoped to the download step below, for the reason spelled out in
      # verify-macos: this job installs a cask and runs the binary it
      # staged, and a job-scoped token is in the environment of every
      # process those steps start. The stake is far lower here — read on a
      # public repository is close to what anyone already has — but the
      # shape is identical and one job doing it differently is how the
      # habit erodes.
    steps:
      - name: Download the archive the checks above verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # By the time this job runs the release is PUBLIC — promote has
          # been and gone, or this is a dispatch against a tag published
          # long ago. So contents: read is enough here, unlike in
          # verify-macos, which reads the same release while it is still a
          # draft and needs write for it.
          gh release download "$TAG" -R "${{ github.repository }}" \
             --pattern '*macOS_arm64.tar.gz' --dir .
          test -s ./*macOS_arm64.tar.gz
          mkdir -p extract-arm64
          tar -xzf ./*macOS_arm64.tar.gz -C extract-arm64
          test -x extract-arm64/octoscope

      - name: The published cask installs the bytes we just verified
        # The prerelease gate now lives on the job (#182), which is why
        # there is none here. It moved with the push itself: the promote
        # job only pushes the tap for a stable tag, exactly as
        # `skip_upload: auto` did inside goreleaser, so a prerelease has no
        # cask to check and this whole job is skipped rather than waiting
        # for one nobody published.
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Read the tap from git rather than the JSON API: the API is
          # regenerated on its own schedule, so right after a release it
          # still describes the PREVIOUS version and this would pass against
          # software we shipped days ago.
          export HOMEBREW_NO_INSTALL_FROM_API=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap gfazioli/tap
          avail=""
          # Four probes around three fetches, so the LAST fetch is followed by
          # a probe. Fetching and then giving up without looking again is a
          # false failure waiting for the one run where the tap lands during
          # that fetch.
          #
          # `|| avail=""` is what makes that true. Without it, `set -e` plus
          # `pipefail` turn a probe that ERRORS — a network blip, a tap that
          # is not there yet, malformed JSON — into an immediate exit from
          # the whole step, so the loop runs zero iterations and the comment
          # above describes a retry that never happens. Demonstrated in a
          # bash one-liner: the failing form prints nothing at all before
          # exiting 1, the guarded form prints all four probes. A probe that
          # could not answer is not a verdict; it is an empty answer, which
          # is exactly what the loop is built to wait out.
          for attempt in 1 2 3 4; do
            avail=$(brew info --cask --json=v2 gfazioli/tap/octoscope 2>/dev/null |
                      jq -r '.casks[0].version // empty') || avail=""
            [ "$avail" = "$version" ] && break
            [ "$attempt" -eq 4 ] && break
            echo "tap offers '${avail:-nothing}', waiting for $version (probe $attempt)"
            sleep 15
            git -C "$(brew --repo gfazioli/tap)" fetch -q origin
            git -C "$(brew --repo gfazioli/tap)" reset -q --hard origin/HEAD
          done
          [ "$avail" = "$version" ] ||
            { echo "::error::tap never offered $version (last saw '${avail:-nothing}')"; exit 1; }

          brew install --cask gfazioli/tap/octoscope
          # `brew install` answers "already installed" and exits 0 without
          # staging anything, so its exit code is not evidence. The installed
          # version is.
          installed=$(brew list --cask --versions octoscope | awk '{print $2}')
          [ "$installed" = "$version" ] ||
            { echo "::error::cask installed '$installed', expected '$version'"; exit 1; }
          linked="$(brew --prefix)/bin/octoscope"
          got=$("$linked" --version)
          echo "got: $got"
          [ "$got" = "octoscope $version" ] ||
            { echo "::error::linked binary said '$got'"; exit 1; }
          # And it is the same artifact, not merely one reporting the same
          # number. The cask's xattr step removes an extended attribute,
          # which does not touch file content, so these must match byte for
          # byte.
          want=$(shasum -a 256 extract-arm64/octoscope | cut -d' ' -f1)
          have=$(shasum -a 256 "$linked" | cut -d' ' -f1)
          [ "$want" = "$have" ] ||
            { echo "::error::the cask installed different bytes: $have vs the verified $want"; exit 1; }
          echo "cask binary matches the verified archive: $want"

  # gfazioli/gh-octoscope exists for one reason: `gh` derives an
  # extension's name from the repository name and refuses anything not
  # prefixed `gh-`, so `gh extension install gfazioli/octoscope` fails
  # before it downloads anything. This job keeps that repo in step.
  #
  # It reads the release the previous job published rather than its
  # dist/ directory. That is deliberate twice over: it makes the job
  # re-runnable on its own with nothing carried over, and it mirrors the
  # bytes users actually get rather than the bytes we happened to build.
  #
  # Stable tags only. gh decides whether a repo is a binary extension by
  # calling /releases/latest — isBinExtension does this *before* and
  # regardless of any --pin — and that endpoint excludes prereleases and
  # drafts. So a gh-octoscope holding only a prerelease is not
  # installable at all, pinned or otherwise. Measured, not inferred.
  mirror:
    needs: promote
    # `needs` for ordering, but deliberately NOT gated on promote having
    # succeeded, for the reason that used to apply to the release job:
    # promote publishes the release FIRST and pushes the tap second, so an
    # expired HOMEBREW_TAP_TOKEN leaves a perfectly good published release
    # and a red job. Under a plain needs-gate the mirror would be skipped,
    # and re-running it would never reach this, because goreleaser rejects
    # the release that already exists. So: run unless the workflow was
    # cancelled, and let the first step decide.
    #
    # What changed with #182 is what "decide" has to mean. Promote can now
    # fail BEFORE publishing, leaving the release a draft — a state the old
    # ordering could not produce, because goreleaser published outright.
    #
    # Measured against a throwaway draft rather than assumed, and the
    # assumption was wrong: `/releases/tags/{tag}` answers **404** for a
    # draft, not 200 with "draft": true. GitHub's own documentation calls
    # that endpoint "get a published release", and it means it. So a draft
    # and an absent release are indistinguishable there, and the step has
    # to ask the list endpoint — which does include drafts for an
    # authorised caller — before it says which of the two it found.
    if: ${{ !cancelled() && github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      # Reads octoscope's own release; the cross-repo write travels on
      # GH_EXTENSION_TOKEN instead.
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      SOURCE: gfazioli/octoscope
      TWIN: gfazioli/gh-octoscope
    steps:
      - name: Is there a release to mirror?
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Asked through `gh api` rather than `gh release view` so the
          # HTTP status is legible. Both exit 1 on every failure alike,
          # and "there is no such release" and "I could not ask" must not
          # collapse into the same answer: a rate limit or a 5xx read as
          # "nothing to mirror" would leave this job green having
          # published nothing, which is the exact shape of bug the 0.30.0
          # cycle spent itself removing — "not checked" wearing the same
          # face as "fine".
          if out=$(gh api "repos/$SOURCE/releases/tags/$TAG" --silent 2>&1); then
            # This endpoint only ever returns PUBLISHED releases, so a 200
            # here is unambiguous.
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q '(HTTP 404)'; then
            # 404 means "not published", which since #182 covers two very
            # different situations: the release was never created, or it
            # exists as a DRAFT because promote did not get to publishing
            # it.
            #
            # This job cannot tell them apart, and an earlier version of it
            # pretended otherwise by querying the list endpoint for a draft
            # with this tag. Measured: at contents: read that endpoint
            # answers 200 and OMITS drafts, so the query could only ever
            # come back empty and report "never published" with a draft
            # sitting right there — the "not checked" wearing the face of
            # "fine" that the paragraph above exists to refuse. Seeing a
            # draft needs push access, which a mirroring job has no other
            # reason to hold.
            #
            # So report what is actually known: whether promote published.
            echo "exists=false" >> "$GITHUB_OUTPUT"
            # Which advice is right depends on WHY promote did not publish,
            # and the two cases want opposite things. A promote that ran
            # and failed has a passing verification behind it, so finishing
            # it is legitimate. A promote that was SKIPPED was skipped
            # because verify-macos did not succeed — telling anyone to
            # re-run promote there is telling them to walk around the gate
            # this whole workflow exists to impose.
            case "${{ needs.promote.result }}" in
              failure)
                echo "::warning title=Nothing published to mirror::promote ran and failed, so $SOURCE@$TAG is still a draft. The macOS verification passed, so re-running the promote job is a legitimate way to finish: it publishes the draft and pushes the cask, and this job can follow."
                ;;
              skipped|cancelled)
                echo "::warning title=Nothing published to mirror::promote never ran (${{ needs.promote.result }}), which on a tag push means the macOS verification did not pass. $SOURCE@$TAG is either still a draft or was never created. Do not re-run promote to get past this — refusing exactly this state is its job. Fix what verify-macos reported first."
                ;;
              *)
                echo "::warning title=Published release has vanished::promote reported '${{ needs.promote.result }}' for $SOURCE@$TAG, but the release is not published now. Something removed or unpublished it."
                ;;
            esac
          else
            # 401, 403, a rate limit, a 5xx, DNS — none of these are an
            # answer about the release.
            echo "could not determine whether $SOURCE@$TAG exists: $out" >&2
            exit 1
          fi

      - name: Download the bare binaries from the published release
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The platforms .goreleaser.yaml builds, spelled the way gh
          # looks for them: it picks an asset with
          # strings.HasSuffix(name, platform+ext). Each is fetched by
          # exact name, so a target dropped from the build fails here
          # instead of quietly shipping an extension that is
          # "unsupported" on somebody's machine.
          for suffix in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64.exe; do
            gh release download "$TAG" --repo "$SOURCE" \
              --pattern "octoscope_${version}_${suffix}" --dir mirror
          done
          ls -l mirror

      - name: Create or repair the twin release on gh-octoscope
        if: steps.source.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_EXTENSION_TOKEN }}
        run: |
          set -euo pipefail
          cat > mirror-notes.md <<NOTES
          octoscope \`$TAG\` as a \`gh\` extension.

          \`\`\`bash
          gh extension install gfazioli/gh-octoscope
          gh octoscope
          \`\`\`

          The binaries here are the ones from
          [gfazioli/octoscope@$TAG](https://github.com/gfazioli/octoscope/releases/tag/$TAG),
          uploaded unchanged. Release notes, changelog and issues live there.
          NOTES

          # Converge rather than create, so the job is re-runnable in
          # every state and not only the happy one. `gh release create`
          # on an existing tag exits 1 with "a release with the same tag
          # name already exists" — measured — so a first attempt that
          # died anywhere after creation would leave the retry
          # permanently stuck on the state it was meant to repair.
          if gh release view "$TAG" --repo "$TWIN" >/dev/null 2>&1; then
            echo "release exists — repairing it rather than recreating"
            gh release upload "$TAG" mirror/* --repo "$TWIN" --clobber
            # --draft/--prerelease=false because this branch is already
            # clobbering the assets and the notes: leaving the
            # publication flags alone would respect an intent the rest
            # of the command overrides anyway, and either one makes the
            # extension unresolvable.
            gh release edit "$TAG" --repo "$TWIN" \
              --draft=false --prerelease=false \
              --notes-file mirror-notes.md

            # --clobber replaces assets whose names collide; it does not
            # remove ones that should not be there. A stray matters for
            # more than the count below: gh selects with HasSuffix and
            # takes the FIRST match it iterates onto, so an extra asset
            # ending in a platform suffix can shadow ours.
            expected=$(cd mirror && printf '%s\n' *)
            gh release view "$TAG" --repo "$TWIN" --json assets \
              --jq '.assets[].name' |
            while read -r name; do
              if ! printf '%s\n' "$expected" | grep -qxF -- "$name"; then
                echo "removing stale asset: $name"
                gh release delete-asset "$TAG" "$name" --repo "$TWIN" --yes
              fi
            done
          else
            gh release create "$TAG" mirror/* \
              --repo "$TWIN" \
              --title "$TAG" \
              --notes-file mirror-notes.md
          fi

          # Verify the effect, not the command: `gh release create` that
          # uploaded nothing also exits 0.
          #
          # Draft and prerelease are asserted alongside the count because
          # they are the difference between a release that exists and one
          # gh can install — see isBinExtension, above.
          read -r count draft pre < <(
            gh release view "$TAG" --repo "$TWIN" \
              --json assets,isDraft,isPrerelease \
              --jq '"\(.assets | length) \(.isDraft) \(.isPrerelease)"')
          echo "$TWIN@$TAG: assets=$count draft=$draft prerelease=$pre"
          [ "$count" -eq 5 ] || { echo "expected 5 assets, found $count"; exit 1; }
          [ "$draft" = "false" ] || { echo "release is a draft; gh cannot resolve it"; exit 1; }
          [ "$pre" = "false" ] || { echo "release is a prerelease; gh cannot resolve it"; exit 1; }
