# CI workflow. Runs on every push and pull-request against main to
# catch the obvious regressions before they reach a tag.
#
# Seven jobs: build (compile-only sanity), test (race-checked unit
# suite), lint (gofmt + go vet), govulncheck (known-vulnerability scan of
# the module dependencies), windows (the same suite plus a start-up smoke
# on a real Windows runner), docker (builds and runs the released image)
# and goreleaser (a full snapshot, so a .goreleaser.yaml regression turns
# a PR red instead of a tag). All but windows share the Ubuntu runner,
# with caching keyed on go.sum so successive runs are fast.
#
# Until 2026-09 nothing here ran on Windows at all: goreleaser
# cross-compiles the windows/amd64 binary at tag time and it was
# shipped without ever having been built natively, tested, or started.
# The windows job exists to stop that binary being a claim.
#
# The vhs-driven smoke tapes (tapes/*.tape) are NOT invoked here —
# they require a real GITHUB_TOKEN with the same scopes a user
# would have, and the asset generation step is intentionally
# human-in-the-loop. CI's job is "did this commit break the
# build?", not "did the rendered output drift?".

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "files need formatting:"
            gofmt -l .
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

  # Windows is the only platform octoscope ships to and never exercises:
  # three packages branch on runtime.GOOS (browse, clipboard, notify)
  # and their Windows arms had never been compiled by CI, let alone run.
  #
  # Deliberately NOT -race here: the Linux `test` job already covers it,
  # and keeping this one to a plain run leaves it fast and independent of
  # whichever C toolchain the runner image happens to ship.
  #
  # The smoke step asserts only what is deterministic and needs no
  # credentials. It does NOT call the GitHub API: an unauthenticated
  # request would depend on the 60/h anonymous quota of a shared runner
  # IP, which is a flake, not a test.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test ./...
      # bash (Git Bash, preinstalled on the runner) rather than pwsh: the
      # assertions are about the binary's exit code and its two streams,
      # and PowerShell's native-command redirection adds an encoding
      # question — a BOM on an "empty" file — that has nothing to do with
      # what is being measured. The binary under test is native Windows
      # either way.
      - name: Smoke — the binary starts and fails honestly
        shell: bash
        env:
          # auth.TokenSource falls back to `gh auth token`, and gh is
          # preinstalled here. Point it at an empty config so the fallback
          # fails the same way on every run.
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GH_CONFIG_DIR: ${{ runner.temp }}/empty-gh-config
        run: |
          set -euo pipefail
          go build -o octoscope.exe .

          version=$(./octoscope.exe --version)
          echo "version: $version"
          case "$version" in
            octoscope*) ;;
            *) echo "--version printed '$version'"; exit 1 ;;
          esac

          ./octoscope.exe --help > /dev/null

          # No token and no username: the scriptable surface must exit
          # non-zero with an empty stdout, so a `--json | jq` pipeline in
          # CI fails instead of parsing nothing. Checked here because this
          # is the entry path a Windows user hits first.
          rc=0
          ./octoscope.exe --json > out.txt 2> err.txt || rc=$?
          echo "--- stderr ---"; cat err.txt
          [ "$rc" -eq 1 ] || { echo "want exit 1, got $rc"; exit 1; }
          [ ! -s out.txt ] || { echo "wrote to stdout on the error path"; exit 1; }
          grep -q "GITHUB_TOKEN" err.txt || { echo "stderr does not name the fix"; exit 1; }

  # The image ships to ghcr.io on every tag, built by goreleaser's
  # dockers_v2 — so a broken Dockerfile is currently only discoverable
  # during a release. This builds it on every PR instead.
  #
  # It does ONE multi-platform build with --push, because that is what
  # dockers_v2 does. The first version of this job ran two independent
  # single-platform `docker build` calls, which pass on a builder that
  # cannot export a manifest list at all — a check that could not fail
  # for the reason it existed to catch. The default `docker` driver only
  # manages multi-platform when the daemon runs the containerd image
  # store; a developer machine that has it enabled builds this happily
  # while a GitHub runner does not, which is how the gap stayed hidden.
  #
  # Pushing needs somewhere to push, hence the throwaway registry beside
  # the job. network=host is what lets the docker-container builder see
  # it on localhost.
  docker:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: network=host

      - name: Build the image the way goreleaser will
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx inspect --bootstrap | grep -E '^(Name|Driver|Platforms):'

          # goreleaser lays the binaries out per platform and the
          # Dockerfile reads $TARGETPLATFORM, so the context has to be
          # shaped the same way or this would be testing a different
          # Dockerfile from the one that ships.
          for arch in amd64 arm64; do
            mkdir -p ctx/linux/$arch
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "ctx/linux/$arch/octoscope" .
          done
          cp Dockerfile ctx/

          docker buildx build --platform=linux/amd64,linux/arm64 \
            -t localhost:5000/octoscope:ci --push ctx

      - name: The manifest carries both architectures
        run: |
          set -euo pipefail
          # Getting TARGETPLATFORM wrong produces a manifest that looks
          # right and serves one architecture's binary under both
          # entries, so the digests are compared as well as the labels.
          docker buildx imagetools inspect localhost:5000/octoscope:ci
          for want in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect localhost:5000/octoscope:ci \
              --format '{{ range .Manifest.Manifests }}{{ .Platform.OS }}/{{ .Platform.Architecture }} {{ end }}' \
              | grep -qw "$want" || { echo "manifest is missing $want"; exit 1; }
          done

      - name: Smoke — the image starts and fails honestly
        run: |
          set -euo pipefail
          img=localhost:5000/octoscope:ci
          # Only the native one is run: the runner is amd64 and executing
          # the arm64 image would need emulation this job deliberately
          # does not install.
          docker pull --platform=linux/amd64 -q "$img"

          version=$(docker run --rm --platform=linux/amd64 "$img" --version)
          echo "version: $version"
          case "$version" in
            octoscope*) ;;
            *) echo "--version printed '$version'"; exit 1 ;;
          esac

          # Same contract the windows job asserts, and the one a
          # `docker run ... --json | jq` pipeline in someone's CI depends
          # on: no token means exit 1 with an empty stdout, not an empty
          # object parsed as success.
          rc=0
          timeout 60 docker run --rm --platform=linux/amd64 "$img" --json > out.txt 2> err.txt || rc=$?
          echo "--- stderr ---"; cat err.txt
          [ "$rc" -eq 1 ] || { echo "want exit 1, got $rc"; exit 1; }
          [ ! -s out.txt ] || { echo "wrote to stdout on the error path"; exit 1; }
          grep -q "GITHUB_TOKEN" err.txt || { echo "stderr does not name the fix"; exit 1; }

          # And with no arguments at all: it must refuse and say why, not
          # hang. The dashboard is unreachable in a container and a run
          # that blocked forever would wedge anybody's pipeline.
          #
          # Deliberately not asserting *which* refusal. There are two,
          # and which one you get depends on the environment rather than
          # on the image: with a token it reaches the TUI and reports
          # "could not open a new TTY", without one it stops earlier at
          # the auth check. The first version of this pinned the TTY
          # string, having been written against a local run that had a
          # token — and this job, which has none, is what caught it.
          #
          # Bounded, and asserted on exit 1 rather than merely non-zero:
          # this is the check that the container does not block, so an
          # unbounded run would hang here instead of reporting it — and
          # `timeout` reports a hang as 124, which "non-zero" would have
          # accepted as a pass. Both refusal paths exit 1 (measured: the
          # TTY one with a token, the auth one without), so 1 is the
          # invariant and 124 is excluded by construction.
          rc=0
          timeout 30 docker run --rm --platform=linux/amd64 "$img" > na.out 2> na.err || rc=$?
          echo "--- stderr (no args) ---"; cat na.err
          [ "$rc" -eq 1 ] || { echo "argument-less run exited $rc, want 1 (124 = it hung)"; exit 1; }
          [ ! -s na.out ] || { echo "wrote to stdout while refusing"; exit 1; }
          [ -s na.err ] || { echo "refused without saying why"; exit 1; }

      - name: The image runs unprivileged
        run: |
          set -euo pipefail
          # distroless:nonroot is the reason; asserted because swapping the
          # base tag by accident would silently give the container root.
          user=$(docker image inspect localhost:5000/octoscope:ci --format '{{.Config.User}}')
          echo "user: $user"
          [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ] \
            || { echo "image would run as root"; exit 1; }

  # Nothing exercised .goreleaser.yaml until a tag pushed, and that
  # already cost a release: v0.31.0 died because the bare binaries gave
  # goreleaser two artifacts per os/arch and the Homebrew tap generator
  # refuses to guess between them. Nothing had published, so the damage
  # was a deleted-and-recreated public tag — but every local snapshot run
  # while developing that change had used `--skip=homebrew`, the one pipe
  # that would have failed.
  #
  # Measured here rather than assumed, by reintroducing the collision on
  # purpose: goreleaser does NOT refuse during defaulting. It sets
  # defaults, builds all five targets, archives them, checksums them, and
  # only then refuses while *rendering* the tap artifact — a minute in. The
  # conclusion still holds, because publishing comes after that, but a
  # regression of this class costs the full build before it says so.
  #
  # So this job runs the real thing with NOTHING skipped. In snapshot
  # mode goreleaser builds every artifact, renders the cask and builds
  # the images without publishing anything, which is precisely the
  # coverage that was missing.
  #
  # Two limits, both measured on the first run rather than assumed, so
  # nobody reads more coverage into this job than it has:
  #
  #   - it needs NO secrets. `homebrew_casks` carries a
  #     .Env.HOMEBREW_TAP_TOKEN template and goreleaser does not evaluate
  #     it while not publishing — it lands in the cask's config verbatim.
  #     That is what lets this job run on a fork's pull request, and it
  #     still held after the migration: this job's first run on #166
  #     failed on the artifact type, not on a missing secret.
  #   - it does NOT exercise the multi-platform manifest. A snapshot
  #     builds one image per platform (`:...-amd64`, `:...-arm64`) and
  #     assembles nothing, so the containerd-versus-overlay2 export
  #     question never arises here. The `docker` job above is what covers
  #     that, by pushing a real manifest to a local registry.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the tag history to compute a version.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: goreleaser release --snapshot, nothing skipped
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned, not floated. The cask this repo ships depends on precise
          # template behaviour — custom_block renders above `version`, and no
          # key emits `postflight_steps` — so a v2 release landing between a
          # green PR snapshot and its tag would publish a cask nothing
          # verified. Bump deliberately, with a snapshot render read by eye.
          version: "v2.18.1"
          args: release --snapshot --clean
        # Deliberately no HOMEBREW_TAP_TOKEN and no GITHUB_TOKEN: a
        # snapshot publishes nothing, and a job that needs the real
        # secrets could not run on a fork's pull request. If goreleaser
        # evaluates the token template even when not publishing, this
        # step is where that shows up.

      - name: The pipes that can only fail at tag time actually ran
        run: |
          set -euo pipefail
          # dist/artifacts.json is goreleaser's own manifest. Counting
          # files by name instead was the first version of this step and
          # it was wrong twice over: the archives are five, not four
          # (Windows ships a zip), and the bare binaries are not files in
          # dist/ at all — `formats: [binary]` registers an upload *name*
          # while the path still points into the build output directory.
          echo "--- artifacts by type ---"
          jq -r '.[] | "\(.type)\t\(.extra.ID // "-")"' dist/artifacts.json | sort | uniq -c

          count() { jq "[.[] | select($1)] | length" dist/artifacts.json; }

          # The tap artifact is the one whose absence cost v0.31.0: two
          # artifacts per os/arch and the tap generator refuses to guess.
          # It is a Cask since #142 — and this assertion is why that
          # migration could not be a one-line config change: it failed
          # here first, reporting "got 0", which is exactly the job this
          # step was added to do.
          n=$(count '.type == "Homebrew Cask"')
          [ "$n" -eq 1 ] || { echo "want 1 rendered cask, got $n — the homebrew_casks pipe did not run"; exit 1; }
          echo "--- dist/homebrew/Casks/octoscope.rb ---"; cat dist/homebrew/Casks/octoscope.rb

          # Five archives (four tarballs plus the Windows zip) and five
          # bare binaries, which are Binary artifacts carrying the
          # separate `binary` archive id.
          n=$(count '.type == "Archive"')
          [ "$n" -eq 5 ] || { echo "want 5 archives, got $n"; exit 1; }
          n=$(count '.type == "Binary" and .extra.ID == "binary"')
          [ "$n" -eq 5 ] || { echo "want 5 bare binaries, got $n"; exit 1; }

          n=$(count '.type == "Checksum"')
          [ "$n" -eq 1 ] || { echo "want a checksums file, got $n"; exit 1; }

          # Both architectures were built. Snapshot mode does NOT
          # assemble the multi-platform manifest — it builds one image
          # per platform and pushes nothing — so this asserts what the
          # snapshot actually covers, and the `docker` job above is what
          # covers the manifest.
          for want in linux/amd64 linux/arm64; do
            n=$(jq --arg p "$want" '[.[] | select(.type == "Docker Image" and (.extra.Platforms // []) == [$p])] | length' dist/artifacts.json)
            [ "$n" -ge 1 ] || { echo "no image built for $want"; exit 1; }
          done

      # A cask can be valid Ruby, install on the maintainer's machine and
      # still be refused on a contributor's: `odeprecated` RAISES rather
      # than warns for anyone with HOMEBREW_DEVELOPER set
      # (utils/output.rb:224, the cask DSL passing the default
      # `disable_for_developers: true` at dsl.rb:861).
      #
      # That is not hypothetical: 0.34.1 shipped `postflight`, deprecated in
      # favour of `postflight_steps`, and `brew info`, `brew install` and
      # `brew upgrade` all failed outright in developer mode. `brew style`
      # had reported it all along and nothing ran it (#177).
      #
      # `brew style` is not the gate, deliberately: goreleaser renders
      # custom_block above `version`, so the cask is permanently red on
      # Cask/StanzaOrder — 10 offences, measured — for a position the
      # template gives us no way to change. A check that is always red is
      # a check nobody reads.
      #
      # So this LOADS the cask instead, which is what makes a deprecation
      # fire. Be precise about the reach, because the obvious claim is too
      # broad: a deprecated stanza nested inside a top-level `on_macos`
      # block is NOT evaluated on a Linux runner and would sail through.
      # Measured, with `preflight` inside `on_linux` read on macOS — clean
      # load — and the same stanza at top level, which errored. Hence the
      # second pass with HOMEBREW_SIMULATE_MACOS_ON_LINUX, Homebrew's own
      # switch for auditing macOS code paths from Linux.
      #
      # That the switch reaches this is settled by Homebrew's dispatch
      # rather than assumed from its description: `on_macos` returns early
      # unless `OnSystem.os_condition_met?(:macos)` (on_system.rb:85),
      # which asks `simulating_or_running_on_macos?`, which tests `os`
      # against the macOS symbols (simulate_system.rb:84) — and on Linux
      # `os` is overridden to answer with a macOS symbol exactly when the
      # variable is set (extend/os/linux/simulate_system.rb:11-13). Read,
      # not run: no Linux Homebrew was available to mutate against, so the
      # end-to-end version of this check is a deprecated stanza planted
      # inside the top-level `on_macos` block, which nobody has run yet.
      #
      # What it still does not cover: this loads the cask, it never
      # installs it, so nothing here proves the quarantine step targets a
      # file that exists or that the installed binary runs. That check
      # needs macOS and a published artifact — it is the release-time one
      # that 0.34.0 shipped without, and it is #179.
      - name: The rendered cask carries no deprecated stanza
        run: |
          set -euo pipefail
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1

          # Homebrew ships on ubuntu-latest but is kept off PATH, so this has
          # to reach it by path — and every shortcut for that has a way of
          # silently reaching something else instead.
          #
          # `eval "$(cmd)"` is the trap: when cmd fails and prints nothing,
          # eval receives the empty string and returns 0, and `set -e` sees
          # nothing wrong. Measured: `bash -c 'set -euo pipefail; eval
          # "$(false)"; echo here'` prints "here". A separate assignment does
          # propagate the failure, because a simple assignment carries the
          # substitution's status — same probe, `v=$(false)` exits 1.
          #
          # So: assert the binary, capture shellenv in its own assignment, and
          # then invoke $brew_bin rather than `brew`. The last part is what
          # makes a second Homebrew on PATH unable to answer for this one.
          brew_bin=/home/linuxbrew/.linuxbrew/bin/brew
          [ -x "$brew_bin" ] || { echo "no brew at $brew_bin — runner image changed"; exit 1; }
          brew_env=$("$brew_bin" shellenv)
          eval "$brew_env"
          "$brew_bin" --version | head -1

          cask=dist/homebrew/Casks/octoscope.rb
          [ -f "$cask" ] || { echo "no rendered cask at $cask"; exit 1; }

          # Assert on the PARSED cask, not on its printed form. The first
          # version of this grepped the output for "octoscope" — which the
          # path we pass in already contains, so brew echoing the filename
          # would have satisfied it. `--json=v2` still raises on a
          # deprecated stanza (measured) and puts the token somewhere noise
          # cannot reach it.
          err=$(mktemp)
          load() {
            local label="$1"; shift
            local out token
            out=$(env "$@" HOMEBREW_DEVELOPER=1 "$brew_bin" info --json=v2 --cask "$cask" 2>"$err") || {
              cat "$err"
              echo "--- the cask above was refused in developer mode ($label) ---"
              return 1
            }
            token=$(printf '%s' "$out" | jq -r '.casks[0].token // empty')
            [ "$token" = "octoscope" ] || {
              echo "$label: loaded no cask — token was '"'"'$token'"'"'"
              return 1
            }
            echo "$label: loaded cask token=$token version=$(printf '%s' "$out" | jq -r '.casks[0].version')"
          }

          load "linux"
          load "macos-simulated" HOMEBREW_SIMULATE_MACOS_ON_LINUX=1

  # The Pages job that used to live here is gone, and its absence is the
  # point of #122 rather than an oversight.
  #
  # It polled /repos/{owner}/{repo}/pages/builds/latest after every push to
  # main, because Pages ran Jekyll over docs/ and a build could fail while
  # the live site kept serving the previous one — a failure that looks
  # exactly like a site that has not changed. That happened for twenty-two
  # hours in August 2026 and nothing said so.
  #
  # The repository now publishes through .github/workflows/pages.yml with
  # no generator in the path, so there is no Jekyll build left to fail, and
  # a deployment that fails is a red run on the commit that caused it. The
  # polling had to go with it either way: /pages/builds reports LEGACY
  # builds, the ones a workflow source stops producing, so leaving it would
  # have left a check that answers about nothing — which is the failure
  # this repository already has a name for, a quiet judge read as a clean
  # verdict.
