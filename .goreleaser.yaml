# goreleaser config for octoscope. Triggered by a `v*` tag push and
# run by the GitHub Actions workflow in .github/workflows/release.yml.
#
# Produces a single-binary archive per (os, arch), a `checksums.txt`
# covering all archives, container images, and a Homebrew cask that is
# RENDERED here but not uploaded: the release workflow's promote job
# commits it to gfazioli/homebrew-tap once the macOS verification has
# passed (#182). Re-running on the same tag is a hard error — bump the
# tag to produce a new release.
#
# Preview locally with:  goreleaser release --snapshot --clean

version: 2

project_name: octoscope

before:
  hooks:
    - go mod tidy

builds:
  - id: octoscope
    env:
      - CGO_ENABLED=0
    # -trimpath strips local build paths from the binary so different
    # machines produce byte-identical archives. -s -w drop DWARF +
    # symbol tables; we don't ship panic traces with filenames anyway.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Windows ARM64 Go support is solid but end-user demand is near
    # zero. Exclude for now; add back if users ask.
    ignore:
      - goos: windows
        goarch: arm64

# Sign with the Developer ID certificate and notarize, between build and
# archive: goreleaser runs this pipe after builds and before archives, so
# the binary inside the .tar.gz is already signed and has been through
# Apple's notary service. Reading the pipe itself
# (internal/pipe/notary/macos.go @ v2.18.1) settled four things:
#
#   - it filters darwin + Binary/UniversalBinary on its own, but `ids`
#     defaults to the PROJECT name, not "every build". Ours happen to be
#     identical; naming the build id is what keeps that an accident we
#     don't depend on.
#   - quill enables the hardened runtime (quill/sign/signing_super_blob.go,
#     `cdFlags = macho.Runtime`) and stamps http://timestamp.apple.com/ts01.
#     Both are Apple prerequisites for notarization and neither is ours to
#     set, which is why nothing here mentions them.
#   - `enabled` is a template, so the pipe is inert without the secrets:
#     `goreleaser release --snapshot` on a laptop still works untouched.
#   - ON TIMEOUT THE PIPE LOGS AND CONTINUES. It only fails on an Invalid
#     or Rejected verdict; a slow notary just prints "notarize timeout" and
#     the release ships signed-but-unnotarized, which looks fine and is the
#     exact failure 0.34.1 was. The macOS verify job in release.yml is what
#     turns that back into a red build — do not delete it as redundant.
#
# Why sign at all, given the cask's xattr hook already works: measured
# 2026-09-13 on a real binary, a Developer ID signature WITHOUT
# notarization is still killed under quarantine — `spctl` answers
# "rejected / source=Unnotarized Developer ID" and the process dies on
# SIGKILL (exit 137). Signing alone buys nothing; the notarization ticket
# is the thing that Gatekeeper looks for. And the hook only ever covered
# `brew install --cask` — a .tar.gz downloaded straight from the Releases
# page never runs it.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      # Explicit, though it matches project_name today — see above.
      ids:
        - octoscope
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        # Apple refuses auth tokens living longer than 20m and goreleaser
        # derives the token lifetime from this, so 20m is the ceiling, not
        # a target. 15m leaves headroom for clock skew.
        timeout: 15m

archives:
  - id: default
    # Use the legacy name_template "formats" combo so macOS/Linux get
    # .tar.gz and Windows gets .zip — what Homebrew and most users
    # expect respectively.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

  # Bare binaries alongside the archives, for the consumers that cannot
  # unpack one: `gh extension install`, a curl in a CI step, a Docker
  # build stage. gh is the strict one — it downloads the release asset
  # and writes it straight to disk as the executable (manager.go's
  # installBin), so an archive is not merely inconvenient there, it is
  # unusable.
  #
  # The name must END with <goos>-<goarch>, because gh selects by
  # suffix: strings.HasSuffix(a.Name, platform+ext). Hence the raw
  # {{ .Os }}-{{ .Arch }} here rather than the friendly macOS/x86_64
  # spelling the archives use — this template is read by a matcher, not
  # by a human. goreleaser appends .exe on Windows, which is the `ext`
  # half of that same suffix.
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}-{{ .Arch }}"

# Images for the scriptable half — `--json` / `--plain` in a CI step or a
# remote shell. See Dockerfile for why the base is distroless rather than
# scratch, and why there is no build stage.
#
# dockers_v2 rather than the older `dockers` + `docker_manifests` pair,
# which goreleaser is phasing out: one entry, both platforms, and the
# multi-arch manifest assembled for us. It uses `docker buildx`, which is
# preinstalled on GitHub's Ubuntu runners — and the ci workflow now builds
# this image on every PR, so that stays a checked fact rather than an
# assumption held until the first tag.
#
# `latest` is conditional on the tag not being a prerelease. Empty tags are
# ignored, so a -rc still publishes its own versioned image — inspectable,
# without moving the tag everybody pulls. Same shape as the rule that now
# governs the cask, which the promote job pushes for stable tags only.
#
# Note what this does NOT do: these images are pushed here, inside the
# release job, before anything verifies them — so `latest` moves before
# the macOS gate has said a word, and stays moved if that gate then
# fails. The gate covers what a macOS user installs, not this. See #191.
dockers_v2:
  - id: octoscope
    ids: [octoscope]
    dockerfile: Dockerfile
    images:
      - "ghcr.io/gfazioli/octoscope"
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # Both, deliberately. Annotations live on the manifest and are the
    # modern OCI surface; labels live in the image config and are what
    # `docker inspect` shows — and what GHCR reads to link a package back
    # to its repository. Setting only annotations leaves the package page
    # orphaned, which is invisible until somebody goes looking for the
    # source from the registry.
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Terminal dashboard for your GitHub account"
      "org.opencontainers.image.url": "https://github.com/gfazioli/octoscope"
      # Spelled out rather than {{ .GitURL }}, which renders the clone
      # URL with a .git suffix. GHCR reads this label to link the package
      # back to its repository, and that link is the point.
      "org.opencontainers.image.source": "https://github.com/gfazioli/octoscope"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "MIT"
    annotations:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.description": "Terminal dashboard for your GitHub account"
      "org.opencontainers.image.url": "https://github.com/gfazioli/octoscope"
      "org.opencontainers.image.source": "https://github.com/gfazioli/octoscope"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.licenses": "MIT"

checksum:
  name_template: "checksums.txt"

changelog:
  # Autogen commit list grouped by conventional-commit scope. Any
  # commit flagged with `chore:` or `docs:` is skipped — those are
  # noise in a binary's changelog.
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Fixes"
      regexp: '^fix'
      order: 1
    - title: "Performance"
      regexp: '^perf'
      order: 2
    - title: "Other"
      order: 999

release:
  github:
    owner: gfazioli
    name: octoscope
  # Published as a DRAFT, and promoted by the release workflow only after
  # the macOS verification passes (#182). Before this, goreleaser published
  # a non-draft release and verify-macos ran afterwards — so an unnotarized
  # binary was downloadable, and the cask live, for the minutes between the
  # publish and the red X. A red job does not un-publish anything.
  #
  # A draft's assets are not at the public download path, which is why the
  # cask is held back too (skip_upload below) rather than pushed alongside:
  # it would point at URLs that 404 until promotion. The cask FILE is still
  # rendered into dist/ — goreleaser's skip check is inside its publish
  # step, not its render step (internal/pipe/cask/cask.go, read at v2.18.1)
  # — and the promote job commits that rendered file, so nothing here
  # re-implements the template.
  draft: true
  prerelease: auto  # -dev / -rc suffixes automatically mark as pre-release
  header: |
    ## octoscope {{.Version}}

    Terminal dashboard for your GitHub account — see [README](https://github.com/gfazioli/octoscope#readme) for a tour.
  footer: |
    ## Install

    Via Homebrew (recommended):

    ```bash
    brew install --cask gfazioli/tap/octoscope
    ```

    Or download a platform-specific archive below and drop the binary on your `$PATH`.

    The bare `*_<os>-<arch>` assets are the same binary without the archive, for a
    `curl` in a CI step or a Docker build stage:

    ```bash
    curl -fsSL -o octoscope \
      https://github.com/gfazioli/octoscope/releases/download/{{ .Tag }}/octoscope_{{ .Version }}_linux-amd64 \
      && chmod +x octoscope
    ```

# Since 0.34.0 this is a CASK, not a formula: `brews` is deprecated and
# `goreleaser check` — which this repo wants as a gate — exits non-zero on
# it. A cask serves Linux Homebrew too, which is what the migration hung
# on for a week: `Cask::Cask#supports_linux?` is true unless the cask says
# `depends_on macos` (Homebrew 6.0+), and goreleaser releases ITSELF as a
# cask carrying on_macos and on_linux for all four os/arch pairs. See
# issue #142 for the three reads that settled it.
homebrew_casks:
  - name: octoscope
    # Scoped to the archive, and this is load-bearing since the bare
    # binaries were added: with two artifacts per os/arch goreleaser
    # refuses outright — "one tap can handle only one archive of an
    # OS/Arch combination" — and it refuses during defaulting, before it
    # builds anything. That is what failed the v0.31.0 tag.
    ids:
      - default
    repository:
      owner: gfazioli
      name: homebrew-tap
      branch: main
      # Kept, and not evaluated. With skip_upload: true below, goreleaser
      # never pushes this repository and never resolves this template:
      # doPublish returns at its skip check well before the token is read,
      # and doRun's template list does not include it (cask.go in v2.18.1,
      # the version the workflow pins). The tap is written by the promote
      # job instead, which holds HOMEBREW_TAP_TOKEN.
      #
      # The field stays so that flipping skip_upload back is one edit — but
      # the workflow no longer passes HOMEBREW_TAP_TOKEN to goreleaser, so
      # that edit means restoring it there too.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): bump octoscope to {{ .Tag }}"
    directory: Casks
    homepage: "https://github.com/gfazioli/octoscope"
    description: "Terminal dashboard for your GitHub account"
    # No `license:` here, deliberately. The key is accepted by the config
    # and the cask template never renders it — measured on the generated
    # file — so carrying it would claim a stanza the artifact does not
    # have. It is the one piece of formula metadata this migration loses,
    # and the repository's LICENSE is where it lives anyway.
    # Always skipped HERE, and pushed by the promote job instead (#182).
    # goreleaser publishes a draft now, whose assets are not yet at the
    # public download path, so a cask pushed in the same run would point at
    # URLs that 404 until promotion.
    #
    # This replaces `skip_upload: auto`, which skipped only for
    # pre-releases. The prerelease rule has not gone away — it moved to the
    # promote job, which pushes the tap only for a stable tag.
    #
    # Not quite the same test, and the difference is worth naming rather
    # than glossing. goreleaser parsed the tag and read one field
    # (internal/pipe/cask/cask.go: SkipUpload == "auto" &&
    # ctx.Semver.Prerelease != ""); the workflow asks whether the tag
    # contains a hyphen. Those agree on every tag this project has ever
    # cut and on every one the release checklist can produce. They part on
    # SemVer build metadata — `v1.2.3+build-1` carries a hyphen outside the
    # prerelease field, so goreleaser called it stable and the workflow
    # would not. Nothing here produces such a tag; if that ever changes,
    # the condition has to be parsed rather than searched.
    #
    # The rendered file is unaffected: its download URLs are derived from
    # the tag, not from whether the release is a draft, so what promote
    # commits is byte-identical to what would have been pushed here.
    skip_upload: true
    # macOS kills this binary without this hook, and the formula never
    # had to care. A cask's download is quarantined (com.apple.quarantine);
    # a formula's is not. Under quarantine Gatekeeper demands a Developer ID
    # signature, and octoscope's binaries carry the Go linker's ad-hoc one —
    # `Signature=adhoc, linker-signed, TeamIdentifier=not set`. The kernel
    # answers SIGKILL and the file is removed, so `octoscope --version`
    # prints nothing and exits 137, on a cask that installed perfectly.
    #
    # Measured on 0.34.0, which shipped broken this way: the same tarball
    # extracted by hand runs fine, and goreleaser's own cask works because
    # its binaries are signed "Developer ID Application: Carlos Becker".
    # Signing and notarising is the durable answer and needs an Apple
    # developer account — tracked separately; stripping the attribute is
    # what a cask can do for an unsigned CLI, and what many do.
    #
    # Guarded, because this cask also serves Linux Homebrew, where nothing
    # quarantines and /usr/bin/xattr does not exist.
    #
    # It lives in custom_block rather than in `hooks.post.install` because
    # goreleaser wraps that key in `postflight do`, and Homebrew deprecated
    # the flight blocks in favour of the declarative `*_steps` ones. The
    # deprecation is not cosmetic: `odeprecated` RAISES instead of warning
    # when the caller is in developer mode (utils/output.rb:224, with the
    # cask DSL passing the default `disable_for_developers: true` at
    # dsl.rb:861), so `HOMEBREW_DEVELOPER=1 brew install` failed outright on
    # 0.34.1. goreleaser cannot emit the new form — `postflight do` is
    # hardcoded in its cask template and its schema (2.18.1) carries no
    # `postflight_steps` key — so the stanza is written out by hand here.
    # custom_block renders above `version`, and that position has a cost
    # worth stating rather than glossing: it WORKS — stanza order does not
    # affect artifact registration, verified by installing from a scratch
    # tap — but it is not style-conformant. `brew style` goes from 4
    # offences to 10, all Cask/StanzaOrder, because a stanza this early
    # puts every later one "out of order" (measured on the rendered file).
    #
    # We take that trade because there is no alternative and the other
    # side is worse. goreleaser's cask template offers raw-Ruby insertion
    # at exactly one point before the artifacts — custom_block — and its
    # other hooks all render the deprecated `*flight do` wrappers. Plenty
    # renders after `binary` — manpages, completions, service, the flight
    # hooks, uninstall, zap, caveats — but every one of those is a typed
    # field, and none of them emits arbitrary Ruby, which is what a
    # postflight_steps block needs to be. So
    # the choice is 6 more cosmetic, autocorrectable style offences on a
    # tap nothing lints, or a stanza that already fails `brew install`
    # outright for developer-mode users and will fail for everyone once
    # the deprecation flips. See #177.
    #
    # `chdir` is load-bearing and was measured, not guessed: `run` passes
    # `args` through verbatim (install_steps.rb:720 — they are not path
    # specs), so the bare "octoscope" resolves against the working
    # directory, and only `chdir` defaults that to the staged path. Drop
    # it and the install fails with `xattr: No such file: octoscope`.
    # A `writable_paths: ["octoscope"]` is NOT needed and was removed
    # after being written: the cask runner already grants the whole
    # Caskroom (cask/artifact/install_steps.rb:44), so declaring a path
    # inside it only reads as a requirement without being one.
    #
    # A wrong path fails loudly rather than silently, which is what makes
    # the release safe to trust here: `run` defaults to must_succeed, so
    # a bad target aborts the install and rolls it back — measured with a
    # deliberately wrong argument.
    # The cask equivalent of the formula's `bin.install "octoscope"`.
    # Plural since goreleaser 2.12.6; the singular form is deprecated and
    # `goreleaser check` says so, which is the gate this issue exists for.
    binaries:
      - octoscope
    # terminal-notifier powers the desktop notifications on macOS (icon +
    # click-through). It CANNOT be expressed through `dependencies:` here:
    # a cask dependency is {cask, formula} with no os field, and the
    # formula declares `depends_on :macos`, so an unscoped one would fail
    # every Linux install for an optional feature. The cask DSL does scope
    # it — `depends_on` sets `@depends_on_set_in_block` when called inside
    # an on_system block (Homebrew/brew, Library/Homebrew/cask/dsl.rb:630,
    # read 2026-09-12) — and custom_block is rendered inside the cask body,
    # so the scoping survives the port. octoscope degrades without it:
    # internal/notify falls back to the in-app change pulse.
    custom_block: |
      on_macos do
        depends_on formula: "terminal-notifier"
      end

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:  ["-dr", "com.apple.quarantine", "octoscope"],
              chdir: "."
        end
      end
    # NOT declared: `conflicts: [{formula: octoscope}]`. It would have
    # kept a user from ending up with two octoscope binaries on PATH, and
    # it does not exist any more — Homebrew removed cask-against-formula
    # conflicts (Homebrew/brew#20499) where they had been a no-op anyway,
    # and goreleaser deprecated the field in 2.12. So the formula → cask
    # transition is a documented manual step rather than something the
    # config can enforce; the order is in #142.
